name: Temp patch worker admin fields

on:
  push:
    branches: ['fix/worksite-pdf-text-alignment-20260916']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/worksite-pdf-text-alignment-20260916
          fetch-depth: 0
      - name: Add optional NUSS and IBAN fields
        run: |
          python - <<'PY'
          from pathlib import Path

          reg = Path('components/RegistrationForm.tsx')
          text = reg.read_text()
          text = text.replace(
              '>Nº Seguridad Social</label>',
              '>Nº Seguridad Social <span className="text-[10px] font-normal text-slate-400">(opcional)</span></label>',
              1,
          )
          text = text.replace(
              '>IBAN / Cuenta bancaria</label>',
              '>IBAN / Cuenta bancaria <span className="text-[10px] font-normal text-slate-400">(opcional)</span></label>',
              1,
          )
          reg.write_text(text)

          edit = Path('components/EditPersonModal.tsx')
          text = edit.read_text()
          marker = '''              </div>\n              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">\n                <div className="space-y-1.5"><label className="block text-xs font-semibold text-slate-500 dark:text-slate-400">Teléfono</label><input type="tel" name="telefono" value={formData.telefono} onChange={handleChange} required list="telefonosListEdit"'''
          insert = '''              </div>\n              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">\n                <div className="space-y-1.5">\n                  <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400">Nº Seguridad Social <span className="text-[10px] font-normal text-slate-400">(opcional)</span></label>\n                  <input type="text" name="numeroSeguridadSocial" value={formData.numeroSeguridadSocial || ''} onChange={handleChange} placeholder="11/12345678/90" className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:border-[#00548E] dark:focus:border-blue-500 transition-all text-sm font-mono text-slate-800 dark:text-slate-100" />\n                  {formData.numeroSeguridadSocial && (() => { const check = validateSpanishSocialSecurityNumber(formData.numeroSeguridadSocial); return <p className={`text-[11px] font-semibold ${check.valid ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-600 dark:text-red-400'}`}>{check.valid ? `✓ Número válido · ${formatSpanishSocialSecurityNumber(check.normalized)}` : `✕ ${check.error}`}</p>; })()}\n                </div>\n                <div className="space-y-1.5">\n                  <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400">IBAN / Cuenta bancaria <span className="text-[10px] font-normal text-slate-400">(opcional)</span></label>\n                  <input type="text" name="iban" value={formData.iban || ''} onChange={handleChange} placeholder="ES00 0000 0000 0000 0000 0000" className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:border-[#00548E] dark:focus:border-blue-500 transition-all text-sm font-mono text-slate-800 dark:text-slate-100" />\n                  {formData.iban && (() => { const check = validateIban(formData.iban); return <p className={`text-[11px] font-semibold ${check.valid ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-600 dark:text-red-400'}`}>{check.valid ? `✓ IBAN válido · ${formatIban(check.normalized)}` : `✕ ${check.error}`}</p>; })()}\n                </div>\n              </div>\n              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">\n                <div className="space-y-1.5"><label className="block text-xs font-semibold text-slate-500 dark:text-slate-400">Teléfono</label><input type="tel" name="telefono" value={formData.telefono} onChange={handleChange} required list="telefonosListEdit"'''
          if marker not in text:
              raise SystemExit('EditPersonModal insertion marker not found')
          text = text.replace(marker, insert, 1)
          edit.write_text(text)
          PY
      - name: Verify optional fields and TypeScript
        run: |
          grep -q 'name="numeroSeguridadSocial"' components/EditPersonModal.tsx
          grep -q 'name="iban"' components/EditPersonModal.tsx
          grep -q 'Nº Seguridad Social.*(opcional)' components/RegistrationForm.tsx
          grep -q 'IBAN / Cuenta bancaria.*(opcional)' components/RegistrationForm.tsx
          npm install --no-audit --no-fund
          npm run lint
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/RegistrationForm.tsx components/EditPersonModal.tsx
          git commit -m "feat: añadir NUSS e IBAN opcionales en trabajador"
          git push origin HEAD:fix/worksite-pdf-text-alignment-20260916
