name: Temporary rename third summary button

on:
  push:
    branches: [work/resumen-renombres-pendientes]
    paths:
      - '.github/workflows/tmp-rename-third-summary-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename third summary button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/Stats.tsx')
          s = p.read_text()
          old = '<Building2 className="w-4 h-4" /> Exportar Resumen de Obra'
          new = '<Building2 className="w-4 h-4" /> Relación nominal de trabajadores por obra'
          if old not in s:
              raise SystemExit('Expected third button label not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/Stats.tsx
          git commit -m 'ui: rename nominal workers by site report button'
          git push
