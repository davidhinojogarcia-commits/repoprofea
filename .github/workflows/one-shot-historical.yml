name: One-shot historical migration
on:
  push:
    branches:
      - feat/firebase-multiusuario
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import historical records into canonical Supabase tables
        env:
          SB_URL: https://oanurwzoymkmwmxoyzqi.supabase.co
          SB_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/migrate-historical.cjs
