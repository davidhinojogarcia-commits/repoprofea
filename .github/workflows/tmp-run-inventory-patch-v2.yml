name: Temporary run inventory patch v2

on:
  push:
    branches:
      - work/resumen-renombres-pendientes
    paths:
      - .github/workflows/tmp-run-inventory-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode prepared files and fix syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          source = Path('.github/workflows/tmp-implement-inventory-core.yml').read_text()
          for key, path in [('COMPONENT_B64','components/InventorySection.tsx'),('MIGRATION_B64','supabase/migrations/20260915153000_shared_inventory_zone6.sql')]:
              m=re.search(r'^\s*'+key+r':\s*(\S+)\s*$',source,re.M)
              if not m: raise SystemExit(f'{key} not found')
              p=Path(path); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
          p=Path('components/InventorySection.tsx'); s=p.read_text()
          marker='</div></div></div>;\n\nconst MovementsView'
          if marker not in s: raise SystemExit('SummaryView marker missing')
          s=s.replace(marker,'</div></div></div>;\n};\n\nconst MovementsView',1)
          p.write_text(s)
          PY
      - name: Wire navigation and app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/Sidebar.tsx'); s=p.read_text()
          if 'Wrench }' not in s:
              s=s.replace("import { LayoutDashboard, UserPlus, Users, Menu, ChevronLeft, Settings, Trash2, Camera, Calendar, CalendarDays, HardHat, BriefcaseBusiness, ShieldCheck, LogOut, Loader2, Files } from 'lucide-react';", "import { LayoutDashboard, UserPlus, Users, Menu, ChevronLeft, Settings, Trash2, Camera, Calendar, CalendarDays, HardHat, BriefcaseBusiness, ShieldCheck, LogOut, Loader2, Files, Wrench } from 'lucide-react';")
          if "| 'inventario'" not in s:
              s=s.replace("| 'documentacion_obra' | 'administracion';", "| 'documentacion_obra' | 'inventario' | 'administracion';")
          anchor="    {\n      label: 'Sistema',\n      items: [\n"
          insert="    {\n      label: 'Logística',\n      items: [\n        { id: 'inventario', label: 'Herramientas y maquinaria', icon: Wrench },\n      ],\n    },\n    {\n      label: 'Sistema',\n      items: [\n"
          if "label: 'Logística'" not in s:
              if anchor not in s: raise SystemExit('Sidebar anchor missing')
              s=s.replace(anchor,insert,1)
          p.write_text(s)

          p=Path('App.tsx'); s=p.read_text()
          lazy="const SaeSection = lazy(() => import('./components/SaeSection').then(module => ({ default: module.SaeSection })));\n"
          if "./components/InventorySection" not in s:
              s=s.replace(lazy,lazy+"const InventorySection = lazy(() => import('./components/InventorySection').then(module => ({ default: module.InventorySection })));\n",1)
          state="  const [activeView, setActiveView] = useState<ViewMode>('dashboard');\n"
          if "inventoryItem" not in s:
              s=s.replace(state,state+"  useEffect(() => {\n    if (new URLSearchParams(window.location.search).has('inventoryItem')) setActiveView('inventario');\n  }, []);\n",1)
          config="          {activeView === 'configuracion' && (\n            <Suspense fallback={<ViewLoadingFallback />}>\n"
          block="          {activeView === 'inventario' && (\n            <Suspense fallback={<ViewLoadingFallback />}>\n              <InventorySection savedObras={savedObras} />\n            </Suspense>\n          )}\n\n"
          if "activeView === 'inventario'" not in s:
              if config not in s: raise SystemExit('App anchor missing')
              s=s.replace(config,block+config,1)
          p.write_text(s)
          PY
      - name: Typecheck and build
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/InventorySection.tsx components/Sidebar.tsx App.tsx supabase/migrations/20260915153000_shared_inventory_zone6.sql src/services/inventoryService.ts src/data/inventoryZona6Seed.ts
          git commit -m 'feat: add shared tools and machinery inventory with traceability' || exit 0
          git push
