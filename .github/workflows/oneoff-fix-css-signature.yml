name: One-off fix CSS signature report
# Triggered to apply configured CSS coordinator name to technical PDF signatures.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-fix-css-signature.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix configured CSS signature in technical PDFs
        shell: python
        run: |
          from pathlib import Path

          section = Path('components/SubcontratasSection.tsx')
          text = section.read_text()

          old = """      await generateSubcontrataReportPDF(
        activeSubcontrata,
        activeSubcontrata.supervisorResponsable
      );"""
          new = """      await generateSubcontrataReportPDF(
        activeSubcontrata,
        activeSubcontrata.supervisorResponsable,
        undefined,
        {
          tecnicoNombre: reporteConfig.tecnicoNombre,
          coordinadorNombre: reporteConfig.coordinadorNombre,
          empresaCoordinacion: reporteConfig.empresaCoordinacion
        }
      );"""
          if old not in text:
              raise SystemExit('Individual PDF call pattern not found')
          text = text.replace(old, new, 1)

          old2 = "await generateObraConsolidatedReportPDF(targetObra, subsInObra, supervisor);"
          new2 = """await generateObraConsolidatedReportPDF(targetObra, subsInObra, supervisor, {
        tecnicoNombre: reporteConfig.tecnicoNombre,
        coordinadorNombre: reporteConfig.coordinadorNombre,
        empresaCoordinacion: reporteConfig.empresaCoordinacion
      });"""
          if old2 not in text:
              raise SystemExit('Consolidated PDF call pattern not found')
          text = text.replace(old2, new2, 1)
          section.write_text(text)

          defaults = Path('src/lib/subcontratasDefaults.ts')
          d = defaults.read_text()

          old3 = """      // Box 4: Coordinación CSS con Empresa
      const sig4X = sig3X + boxW + gap;
      doc.roundedRect(sig4X, sigY, boxW, 21, 1.5, 1.5, 'S');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(6.5);
      doc.setTextColor(15, 23, 42);
      doc.text('Coordinación CSS:', sig4X + 2, sigY + 4);
      if (effectiveEmpresa) {
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(5.2);
        doc.setTextColor(0, 84, 142);
        doc.text(`Empresa: ${effectiveEmpresa}`, sig4X + 2, sigY + 7.5, { maxWidth: boxW - 4 });
      }
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(5.8);
      doc.setTextColor(71, 85, 105);
      doc.text(`Fdo: ${effectiveCoordinador}`, sig4X + 2, sigY + 17, { maxWidth: boxW - 4 });"""
          new3 = """      // Box 4: Coordinación de Seguridad y Salud
      const sig4X = sig3X + boxW + gap;
      doc.roundedRect(sig4X, sigY, boxW, 21, 1.5, 1.5, 'S');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(6.5);
      doc.setTextColor(15, 23, 42);
      doc.text('Coordinación de Seguridad y Salud:', sig4X + 2, sigY + 4, { maxWidth: boxW - 4 });
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(6.2);
      doc.setTextColor(0, 84, 142);
      doc.text(effectiveCoordinador, sig4X + 2, sigY + 9, { maxWidth: boxW - 4 });
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(5.8);
      doc.setTextColor(71, 85, 105);
      doc.text(`Fdo: ${effectiveCoordinador}`, sig4X + 2, sigY + 17, { maxWidth: boxW - 4 });"""
          if old3 not in d:
              raise SystemExit('Individual signature block pattern not found')
          d = d.replace(old3, new3, 1)

          old4 = """    // Box 4: Coordinador de Seguridad y Salud (CSS) con Empresa de Coordinación
    const sig4X = sig3X + boxW + gap;
    sigDoc.roundedRect(sig4X, sigBoxY, boxW, 22, 1.5, 1.5, 'S');
    sigDoc.setFont('helvetica', 'bold');
    sigDoc.setFontSize(6.5);
    sigDoc.setTextColor(15, 23, 42);
    sigDoc.text('Coordinación CSS:', sig4X + 2, sigBoxY + 4);
    if (effectiveOptions.empresaCoordinacion) {
      sigDoc.setFont('helvetica', 'bold');
      sigDoc.setFontSize(5.2);
      sigDoc.setTextColor(0, 84, 142);
      sigDoc.text(`Empresa: ${effectiveOptions.empresaCoordinacion}`, sig4X + 2, sigBoxY + 8, { maxWidth: boxW - 4 });
    }
    sigDoc.setFont('helvetica', 'normal');
    sigDoc.setFontSize(5.8);
    sigDoc.setTextColor(71, 85, 105);
    const coordTxt = effectiveOptions.coordinadorNombre ? `Fdo: ${effectiveOptions.coordinadorNombre}` : 'Fdo: Coordinador CSS';
    sigDoc.text(coordTxt, sig4X + 2, sigBoxY + 18, { maxWidth: boxW - 4 });"""
          new4 = """    // Box 4: Coordinación de Seguridad y Salud
    const sig4X = sig3X + boxW + gap;
    sigDoc.roundedRect(sig4X, sigBoxY, boxW, 22, 1.5, 1.5, 'S');
    sigDoc.setFont('helvetica', 'bold');
    sigDoc.setFontSize(6.5);
    sigDoc.setTextColor(15, 23, 42);
    sigDoc.text('Coordinación de Seguridad y Salud:', sig4X + 2, sigBoxY + 4, { maxWidth: boxW - 4 });
    sigDoc.setFont('helvetica', 'bold');
    sigDoc.setFontSize(6.2);
    sigDoc.setTextColor(0, 84, 142);
    const coordinatorName = effectiveOptions.coordinadorNombre || 'Coordinador/a CSS';
    sigDoc.text(coordinatorName, sig4X + 2, sigBoxY + 9, { maxWidth: boxW - 4 });
    sigDoc.setFont('helvetica', 'normal');
    sigDoc.setFontSize(5.8);
    sigDoc.setTextColor(71, 85, 105);
    const coordTxt = `Fdo: ${coordinatorName}`;
    sigDoc.text(coordTxt, sig4X + 2, sigBoxY + 18, { maxWidth: boxW - 4 });"""
          if old4 not in d:
              raise SystemExit('Consolidated signature block pattern not found')
          d = d.replace(old4, new4, 1)
          defaults.write_text(d)

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Remove one-off workflow
        run: git rm .github/workflows/oneoff-fix-css-signature.yml

      - name: Commit changes
        run: |
          git config user.name "davidhinojogarcia-commits"
          git config user.email "davidhinojogarcia@gmail.com"
          git add components/SubcontratasSection.tsx src/lib/subcontratasDefaults.ts
          git commit -m "fix: use configured CSS coordinator name in technical PDFs"
          git push origin main
