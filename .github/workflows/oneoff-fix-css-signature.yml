name: One-off fix CSS signature report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-fix-css-signature.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply PDF signature fix
        run: python scripts/fix_css_signature_pdf.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Clean one-off files
        run: git rm .github/workflows/oneoff-fix-css-signature.yml scripts/fix_css_signature_pdf.py
      - name: Commit changes
        run: |
          git config user.name "davidhinojogarcia-commits"
          git config user.email "davidhinojogarcia@gmail.com"
          git add components/SubcontratasSection.tsx src/lib/subcontratasDefaults.ts
          git commit -m "fix: use configured CSS coordinator name in technical PDFs"
          git push origin main
