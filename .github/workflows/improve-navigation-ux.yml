name: Improve PROFEA navigation UX

on:
  push:
    paths:
      - '.github/workflows/improve-navigation-ux.yml'

permissions:
  contents: write

jobs:
  improve-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve responsive navigation and reading comfort
        run: |
          python <<'PY'
          from pathlib import Path

          # Sidebar: wider drawer on phones, denser groups, larger touch targets.
          sidebar = Path('components/Sidebar.tsx')
          text = sidebar.read_text()
          text = text.replace("${isMobileOpen ? 'translate-x-0 w-64' : '-translate-x-full lg:translate-x-0'}", "${isMobileOpen ? 'translate-x-0 w-[min(88vw,20rem)]' : '-translate-x-full lg:translate-x-0'}")
          text = text.replace('nav className="flex-1 py-6 px-3 space-y-2 overflow-y-auto custom-scrollbar"', 'nav className="flex-1 py-4 px-3 space-y-2 overflow-y-auto overscroll-contain custom-scrollbar"')
          text = text.replace('profea-sidebar-item w-full flex items-center gap-3 px-3 py-3 rounded-xl', 'profea-sidebar-item w-full min-h-12 flex items-center gap-3 px-3 py-2.5 rounded-xl')
          sidebar.write_text(text)

          # Header: reduce vertical occupation, especially on mobile/tablet.
          header = Path('components/Header.tsx')
          text = header.read_text()
          text = text.replace('ui-glass p-4 sm:p-5 md:p-6 rounded-2xl mb-6 md:mb-8', 'ui-glass p-3 sm:p-4 md:p-5 rounded-2xl mb-4 md:mb-6')
          text = text.replace('gap-4 md:gap-6 w-full max-w-none', 'gap-3 md:gap-6 w-full max-w-none')
          text = text.replace('gap-2.5 sm:gap-4 w-full md:w-auto justify-between md:justify-end', 'gap-2 sm:gap-3 w-full md:w-auto justify-end')
          header.write_text(text)

          css_path = Path('src/styles/design-system.css')
          css = css_path.read_text()
          marker = '/* Navigation comfort v2 */'
          if marker not in css:
              css += r'''

/* Navigation comfort v2 */
html {
  scroll-padding-top: 6rem;
}

body {
  min-width: 320px;
  overflow-x: hidden;
}

main,
[role="main"] {
  min-width: 0;
}

.profea-sidebar-shell nav {
  scrollbar-gutter: stable;
  overscroll-behavior: contain;
}

.profea-sidebar-item {
  min-height: 3rem;
  text-align: left;
}

.profea-sidebar-item svg {
  flex: 0 0 auto;
}

/* Keep dense data regions usable instead of shrinking columns into illegibility. */
#root .overflow-x-auto {
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  scrollbar-width: thin;
}

#root table {
  border-collapse: separate;
  border-spacing: 0;
}

#root table thead th {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--ui-surface-soft);
}

/* Make controls easier to acquire by touch without visually bloating desktop. */
@media (pointer: coarse) {
  #root button,
  #root [role="button"],
  #root select,
  #root input:not([type="checkbox"]):not([type="radio"]) {
    min-height: 44px;
  }

  #root input[type="checkbox"],
  #root input[type="radio"] {
    min-width: 20px;
    min-height: 20px;
  }
}

/* Phone navigation: compact top bar, comfortable drawer and bottom breathing room. */
@media (max-width: 640px) {
  html {
    scroll-padding-top: 4.75rem;
  }

  .app-navigation-panel {
    border-radius: 1rem;
  }

  header,
  .app-navigation-panel {
    max-width: 100%;
  }

  .profea-sidebar-shell {
    width: min(88vw, 20rem) !important;
    max-width: 20rem;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .profea-sidebar-shell nav {
    padding-top: .75rem;
    padding-bottom: .75rem;
  }

  .profea-sidebar-item {
    min-height: 3.15rem;
    border-radius: .9rem;
  }

  #root main,
  #root [role="main"] {
    padding-left: max(.65rem, env(safe-area-inset-left));
    padding-right: max(.65rem, env(safe-area-inset-right));
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
  }

  #root .ui-surface,
  #root .ui-surface-soft {
    border-radius: 1rem;
  }

  #root table {
    font-size: .82rem;
  }

  #root table th,
  #root table td {
    padding-left: .65rem;
    padding-right: .65rem;
  }

  /* Forms read as a single comfortable column on narrow screens. */
  #root form .grid {
    grid-template-columns: minmax(0, 1fr) !important;
  }

  #root .flex > button,
  #root .flex > a {
    flex-shrink: 0;
  }
}

/* Tablet: reduce dead space while keeping forms and data readable. */
@media (min-width: 641px) and (max-width: 1023px) {
  .profea-sidebar-shell {
    width: min(42vw, 21rem) !important;
  }

  #root main,
  #root [role="main"] {
    padding-left: 1rem;
    padding-right: 1rem;
  }

  #root .ui-surface,
  #root .ui-surface-soft {
    border-radius: 1.1rem;
  }
}

/* Desktop: preserve a broad content canvas and comfortable reading density. */
@media (min-width: 1280px) {
  #root main,
  #root [role="main"] {
    min-width: 0;
  }

  .profea-sidebar-shell nav {
    padding-bottom: 1rem;
  }
}
'''
              css_path.write_text(css)
          PY

      - name: Validate TypeScript
        run: |
          npm install --no-audit --no-fund
          npm run lint

      - name: Build application
        run: npm run build

      - name: Commit navigation UX improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Sidebar.tsx components/Header.tsx src/styles/design-system.css
          if git diff --cached --quiet; then
            echo "No navigation changes to commit"
            exit 0
          fi
          git commit -m "Improve responsive navigation comfort"
          git push origin HEAD:main

