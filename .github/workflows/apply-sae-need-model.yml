name: Apply SAE need-sheet patch

on:
  push:
    paths:
      - '.github/workflows/apply-sae-need-model.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_sae_need_model.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/SaeSection.tsx
          git commit -m 'feat(sae): adapt need review to PROFEA workforce sheet'
          git push
