name: Temporary mobile camera validation

on:
  push:
    branches:
      - mobile-device-camera-button
    paths:
      - '.github/workflows/tmp-mobile-camera-button.yml'
      - '.github/scripts/patch_mobile_camera_button.py'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-device-camera-button
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply mobile camera patch
        run: python3 .github/scripts/patch_mobile_camera_button.py
      - name: Install dependencies
        run: npm ci
      - name: Lint and typecheck
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Commit validated source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CameraScannerModal.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: add local mobile camera button"
          git push origin HEAD:mobile-device-camera-button
