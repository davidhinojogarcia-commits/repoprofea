name: Homogenize PROFEA interface

on:
  push:
    paths:
      - '.github/workflows/homogenize-ui.yml'

permissions:
  contents: write

jobs:
  homogenize-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add shared modal language and normalize modal shells
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          css_path = Path('src/styles/design-system.css')
          css = css_path.read_text()
          marker = '/* Unified modal language */'
          block = r'''

/* Unified modal language */
.profea-modal-backdrop {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  background: rgba(7, 17, 29, .58) !important;
  -webkit-backdrop-filter: blur(12px) saturate(125%);
  backdrop-filter: blur(12px) saturate(125%);
  overflow-y: auto;
}

.profea-modal-shell {
  width: 100%;
  max-height: min(92dvh, 980px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--ui-surface) !important;
  color: var(--ui-text);
  border: 1px solid var(--ui-border) !important;
  border-radius: var(--ui-radius-xl) !important;
  box-shadow: var(--ui-shadow-lg) !important;
}

.profea-modal-header {
  flex: 0 0 auto;
  background: color-mix(in srgb, var(--ui-surface) 94%, transparent) !important;
  border-bottom: 1px solid var(--ui-border) !important;
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  backdrop-filter: blur(16px) saturate(140%);
}

.profea-modal-footer {
  flex: 0 0 auto;
  background: var(--ui-surface-soft) !important;
  border-top: 1px solid var(--ui-border) !important;
}

.profea-modal-shell input:not([type='checkbox']):not([type='radio']),
.profea-modal-shell select,
.profea-modal-shell textarea {
  border-radius: var(--ui-radius-md) !important;
  border-color: var(--ui-border) !important;
  background-color: var(--ui-surface) !important;
  color: var(--ui-text) !important;
}

.profea-modal-shell input:not([type='checkbox']):not([type='radio']):hover,
.profea-modal-shell select:hover,
.profea-modal-shell textarea:hover {
  border-color: var(--ui-border-strong) !important;
}

.profea-modal-shell input:not([type='checkbox']):not([type='radio']):focus,
.profea-modal-shell select:focus,
.profea-modal-shell textarea:focus {
  border-color: var(--ui-brand-500) !important;
  box-shadow: var(--ui-focus) !important;
  outline: none !important;
}

.profea-modal-shell button[class*='px-'][class*='py-'] {
  border-radius: var(--ui-radius-md) !important;
  transition-duration: var(--ui-motion-base) !important;
}

.profea-modal-shell h1,
.profea-modal-shell h2,
.profea-modal-shell h3,
.profea-modal-shell h4 {
  color: var(--ui-text);
}

.profea-modal-shell table thead {
  background: var(--ui-surface-soft);
}

.profea-modal-shell table th {
  color: var(--ui-text-muted);
  border-color: var(--ui-border);
}

.profea-modal-shell table td {
  border-color: var(--ui-border);
}

@media (max-width: 640px) {
  .profea-modal-backdrop {
    align-items: flex-end;
    padding: .5rem;
  }

  .profea-modal-shell {
    max-height: 94dvh;
    border-radius: 1.15rem !important;
  }
}
'''
          if marker not in css:
              css_path.write_text(css.rstrip() + block + '\n')

          changed = []
          for path in sorted(Path('components').glob('**/*Modal.tsx')):
              text = path.read_text()
              original = text

              # Normalize the first full-screen backdrop in each modal component.
              text, n1 = re.subn(
                  r'className="(fixed inset-0(?![^\"]*profea-modal-backdrop)[^\"]*)"',
                  lambda m: f'className="profea-modal-backdrop {m.group(1)}"',
                  text,
                  count=1,
              )

              if n1:
                  # Normalize the first likely modal card/shell following the backdrop.
                  text, _ = re.subn(
                      r'className="((?![^\"]*profea-modal-shell)[^\"]*(?:bg-white|bg-slate-50|dark:bg-slate-900)[^\"]*(?:rounded-2xl|rounded-3xl)[^\"]*(?:shadow-xl|shadow-2xl)[^\"]*)"',
                      lambda m: f'className="profea-modal-shell {m.group(1)}"',
                      text,
                      count=1,
                  )

                  # First border-bottom block inside the shell is the modal header in the app's modal convention.
                  text, _ = re.subn(
                      r'className="((?![^\"]*profea-modal-header)[^\"]*border-b[^\"]*)"',
                      lambda m: f'className="profea-modal-header {m.group(1)}"',
                      text,
                      count=1,
                  )

                  # Prefer the last border-top block as the footer. Replace only when it looks like an action/footer region.
                  matches = list(re.finditer(r'className="((?![^\"]*profea-modal-footer)[^\"]*border-t[^\"]*(?:flex|grid)[^\"]*)"', text))
                  if matches:
                      m = matches[-1]
                      replacement = f'className="profea-modal-footer {m.group(1)}"'
                      text = text[:m.start()] + replacement + text[m.end():]

              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          print('Normalized modal files:')
          for item in changed:
              print(' -', item)
          PY

      - name: Verify TypeScript
        run: |
          npm install --no-audit --no-fund
          npm run lint

      - name: Build application
        run: npm run build

      - name: Commit UI homogenization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/design-system.css components
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
            exit 0
          fi
          git commit -m "Homogenize modal interface across PROFEA"
          git push origin HEAD:main
