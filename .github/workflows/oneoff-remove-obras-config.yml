name: One-off remove obras configuration UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-remove-obras-config.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Obras configuration section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/Configuracion.tsx')
          s = p.read_text(encoding='utf-8')
          old_default = "useState<'obras' | 'lugares' | 'sitios' | 'telefonos' | 'categorias' | 'backup' | 'jornada'>('obras')"
          new_default = "useState<'obras' | 'lugares' | 'sitios' | 'telefonos' | 'categorias' | 'backup' | 'jornada'>('lugares')"
          if old_default not in s:
              raise SystemExit('activeTab default not found')
          s = s.replace(old_default, new_default, 1)
          tab_line = "    { id: 'obras', label: 'Obras', icon: MapPin, list: savedObras, setter: setSavedObras },\n"
          if tab_line not in s:
              raise SystemExit('Obras tab line not found')
          s = s.replace(tab_line, '', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Remove one-off workflow
        run: rm -f .github/workflows/oneoff-remove-obras-config.yml

      - name: Commit changes
        run: |
          git config user.name "davidhinojogarcia-commits"
          git config user.email "davidhinojogarcia@gmail.com"
          git add -A
          git commit -m "fix: remove obras and preventive resources configuration UI"
          git push origin HEAD:main
