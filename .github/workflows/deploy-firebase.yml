name: Deploy Firebase backend

on:
  workflow_dispatch:
  push:
    branches: ['main', 'feat/firebase-multiusuario']
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Configure initial administrator
        working-directory: functions
        env:
          INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
        run: |
          test -n "$INITIAL_ADMIN_EMAIL" || { echo 'Missing INITIAL_ADMIN_EMAIL GitHub secret.'; exit 1; }
          printf 'INITIAL_ADMIN_EMAIL=%s\n' "$INITIAL_ADMIN_EMAIL" > .env
      - name: Build Functions
        working-directory: functions
        run: npm run build
      - name: Deploy Functions and Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: composite-proton-ktxfk
        run: |
          test -n "$FIREBASE_TOKEN" || { echo 'Missing FIREBASE_TOKEN GitHub secret.'; exit 1; }
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions,firestore:rules --token "$FIREBASE_TOKEN" --non-interactive
