name: Temp fix restore persistence and admin UI

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-fix-restore-admin.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_fix_restore_admin.py
      - name: Verify requested changes
        run: |
          grep -n "restoreBackupToSupabase" components/Configuracion.tsx
          ! grep -n "Volver a la aplicación" components/AdminPanel.tsx
          grep -n "bg-blue-600" components/AdminPanel.tsx
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit fix and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_fix_restore_admin.py .github/workflows/temp-fix-restore-admin.yml
          git add -A
          git commit -m 'fix: persist backup restore and align admin controls'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
