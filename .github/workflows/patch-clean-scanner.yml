name: Patch clean document scanner

on:
  push:
    paths:
      - '.github/workflows/patch-clean-scanner.yml'

permissions:
  contents: write

jobs:
  patch-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simplify scanner data extraction
        shell: python
        run: |
          from pathlib import Path

          path = Path('components/CameraScannerModal.tsx')
          text = path.read_text(encoding='utf-8')

          # 1) Replace the confirmation-by-confirmation flow with a single automatic,
          # validated extraction that keeps the scanner open and ready for the next capture.
          start = text.index("      const accepted: { dni?: string; birthDate?: string; nuss?: string; iban?: string; documentText?: string } = {")
          end_marker = "      handleClose();\n"
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''      const accepted: { dni?: string; birthDate?: string; nuss?: string; iban?: string; documentText?: string } = {\n        documentText: detected.text,\n        ...(detected.dni ? { dni: detected.dni } : {}),\n        ...(detected.birthDate ? { birthDate: detected.birthDate } : {}),\n        ...(detected.nuss ? { nuss: detected.nuss } : {}),\n        ...(detected.iban ? { iban: detected.iban } : {}),\n      };\n\n      const acceptedCount = [accepted.dni, accepted.birthDate, accepted.nuss, accepted.iban].filter(Boolean).length;\n      if (!acceptedCount) {\n        onToast('No se han encontrado datos válidos para incorporar. Repite la foto o introdúcelos manualmente.', 'error');\n        return;\n      }\n\n      window.dispatchEvent(new CustomEvent('profea:administrative-data-recognized', {\n        detail: accepted,\n      }));\n\n      // Una vez entregados los datos al formulario, liberamos el escáner para la siguiente persona.\n      setPages([]);\n      setPreviewImage(null);\n      if (fileInputRef.current) fileInputRef.current.value = '';\n      if (galleryInputRef.current) galleryInputRef.current.value = '';\n\n      const detectedLabels = [\n        accepted.dni ? 'DNI/NIE' : '',\n        accepted.birthDate ? 'fecha de nacimiento' : '',\n        accepted.nuss ? 'Seguridad Social' : '',\n        accepted.iban ? 'IBAN' : '',\n      ].filter(Boolean).join(', ');\n\n      onToast(`Datos incorporados: ${detectedLabels}. Escáner listo para la siguiente captura.`, 'success');\n'''
          text = text[:start] + replacement + text[end:]

          # 2) Rename the useful local OCR action so the UI describes the task, not the technology.
          text = text.replace(
              'title="Reconocer Nº de Seguridad Social e IBAN con OCR local"',
              'title="Reconocer DNI/NIE, fecha de nacimiento, Nº de Seguridad Social e IBAN"'
          )
          text = text.replace(
              '                    Seguridad Social / IBAN\n',
              '                    Extraer datos\n'
          )

          # 3) Remove the redundant generic AI button from the footer.
          ai_start_marker = '''                {pages.length > 0 && (\n                  <button\n                    onClick={handleRecognizeWorkers}'''
          ai_start = text.find(ai_start_marker)
          if ai_start == -1:
              raise SystemExit('No se encontró el bloque del botón Reconocer con IA')

          next_button_marker = '''\n                <button\n                  onClick={handleClose}'''
          ai_end = text.find(next_button_marker, ai_start)
          if ai_end == -1:
              raise SystemExit('No se encontró el final del bloque del botón Reconocer con IA')
          text = text[:ai_start] + text[ai_end:]

          path.write_text(text, encoding='utf-8')

      - name: Verify old AI action is gone
        run: |
          ! grep -q "Reconocer con IA" components/CameraScannerModal.tsx
          grep -q "Extraer datos" components/CameraScannerModal.tsx
          grep -q "Escáner listo para la siguiente captura" components/CameraScannerModal.tsx

      - name: Commit scanner cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CameraScannerModal.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Simplify document scanner data extraction"
          git push origin HEAD:main
