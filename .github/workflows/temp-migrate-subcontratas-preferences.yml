name: Temp migrate subcontratas preferences

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-migrate-subcontratas-preferences.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_migrate_subcontratas_preferences.py
      - name: Verify local business storage removal in migrated preferences
        run: |
          ! grep -n "localStorage.setItem(REPORTE_TECNICO_CONFIG_STORAGE_KEY" src/lib/subcontratasDefaults.ts
          ! grep -n "localStorage.setItem(OBRAS_RECURSOS_PREVENTIVOS_STORAGE_KEY" src/lib/subcontratasDefaults.ts
          grep -n "hydrateStoredSubcontratasPreferences" components/AuthGate.tsx
          grep -n "replaceStoredObrasRecursosPreventivos" components/Configuracion.tsx
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit migration and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_migrate_subcontratas_preferences.py .github/workflows/temp-migrate-subcontratas-preferences.yml
          git add -A
          git commit -m 'feat: store subcontratas preferences in Supabase'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
