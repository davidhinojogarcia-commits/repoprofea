name: Temp admin brand alignment

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-admin-brand.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Align Administration with app brand
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('components/AdminPanel.tsx')
          s = p.read_text()
          old = 'bg-blue-600 text-white hover:bg-blue-700 dark:bg-blue-600 dark:text-white dark:hover:bg-blue-500'
          new = 'bg-brand-primary text-white hover:bg-brand-secondary dark:bg-brand-primary dark:text-white dark:hover:bg-brand-secondary'
          if old not in s:
              raise SystemExit('Expected Administration blue classes not found')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('components/Sidebar.tsx')
          s = p.read_text()
          old = "activeView === 'administracion' ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 border-slate-900 dark:border-white' : 'bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800'"
          new = "activeView === 'administracion' ? 'bg-brand-primary text-white border-brand-primary shadow-md shadow-brand-primary/20 hover:bg-brand-secondary dark:bg-brand-primary dark:text-white dark:border-brand-primary dark:hover:bg-brand-secondary' : 'bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-brand-primary dark:hover:text-blue-400'"
          if old not in s:
              raise SystemExit('Expected Administration sidebar classes not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit verified branding fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-admin-brand.yml
          git add components/AdminPanel.tsx components/Sidebar.tsx
          git commit -m 'fix: align administration with app brand color'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
