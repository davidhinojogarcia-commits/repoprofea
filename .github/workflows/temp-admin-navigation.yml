name: Temp admin navigation repair

on:
  push:
    branches: ['temp-admin-navigation']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_admin_navigation_fix.py
      - name: Verify integrated admin controls
        run: |
          grep -n "administracion" components/Sidebar.tsx
          grep -n "AdminPanel" App.tsx
          ! grep -n "fixed bottom-5 left-5" components/AuthGate.tsx
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.tsx components/AuthGate.tsx components/Sidebar.tsx components/AdminPanel.tsx
          git commit -m 'fix: integrate administration into sidebar navigation'
          git push origin HEAD:temp-admin-navigation
