name: One-off fix notification modal

on:
  push:
    branches: [refactor-ui-foundation]
    paths:
      - '.github/workflows/oneoff-fix-notification-modal.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refactor-ui-foundation
      - run: python scripts/fix_notification_modal_mobile.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: |
          if grep -n "Cerrar Modal" components/PushNotificationManagerModal.tsx; then
            echo "Redundant notification modal close footer still present"
            exit 1
          fi
      - run: git rm -f .github/workflows/oneoff-fix-notification-modal.yml scripts/fix_notification_modal_mobile.py
      - run: |
          git config user.name "davidhinojogarcia-commits"
          git config user.email "davidhinojogarcia@gmail.com"
          git add components/PushNotificationManagerModal.tsx notification-modal-layout.css
          git commit -m "fix: simplify notification modal on mobile"
          git push origin refactor-ui-foundation
