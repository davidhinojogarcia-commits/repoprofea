name: One-shot runtime cleanup

on:
  push:
    branches: ['feat/firebase-multiusuario']

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/firebase-multiusuario
          fetch-depth: 0
      - name: Patch App runtime leftovers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('App.tsx')
          s = p.read_text()
          anchor = "  const [googleToken, setGoogleToken] = useState<string | null>(null);\n"
          if 'const handleGoogleLogin = async () =>' not in s:
              insert = """  const handleGoogleLogin = async () => {\n    setToast({ message: 'La conexión directa con Google Drive está deshabilitada en esta versión.', type: 'error' });\n  };\n  const handleGoogleLogout = async () => {\n    setGoogleUser(null);\n    setGoogleToken(null);\n  };\n"""
              if anchor not in s:
                  raise SystemExit('googleToken anchor not found')
              s = s.replace(anchor, anchor + insert, 1)
          s = s.replace("              {isOffline && (\n                <p className=\"text-[10px] text-amber-400 font-medium\">\n                  ⚠️ Sin conexión a internet para sincronizar en tiempo real.\n                </p>\n              )}\n", "", 1)
          s = s.replace('Sincronizando registros en la nube...', 'Buscando el registro en Supabase...')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.tsx
          git commit -m 'fix: remove startup runtime leftovers [runtime-cleanup]'
          git push origin HEAD:feat/firebase-multiusuario
