name: Apply citas Supabase codemod

on:
  push:
    branches: ['feat/firebase-multiusuario']

permissions:
  contents: write

jobs:
  codemod:
    if: github.event.head_commit.message == 'chore: apply citas Supabase codemod trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/firebase-multiusuario
      - name: Replace legacy citas bindings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/GestionCitas.tsx')
          s = p.read_text()
          replacements = [
            ("import React, { useState, useEffect, useMemo } from 'react';", "import React, { useState, useEffect, useMemo, useCallback } from 'react';"),
            ("import { auth } from '../src/lib/firebase';\nimport { createDocument, subscribeToDocuments } from '../src/services/firestoreService';\nimport type { Unsubscribe } from 'firebase/firestore';", "import { createDocument, deleteDocument, subscribeToDocuments } from '../src/services/databaseService';"),
            ("interface ScheduledCita {\n  citaDia: string;", "interface ScheduledCita {\n  id?: string;\n  citaDia: string;"),
            ("  // Persist generated anonymous tickets history in localStorage", "  // Persistencia directa de citaciones en Supabase"),
            ("    const uid = auth.currentUser?.uid;\n    if (!uid) return;\n    const unsubscribe: Unsubscribe = subscribeToDocuments<ScheduledCita>('appointments', items => {", "    const unsubscribe = subscribeToDocuments<ScheduledCita>('citas', items => {"),
            ("      console.error('Error leyendo citas de Firestore:', error);\n      onToast('No se pudieron cargar las citas desde Firebase.', 'error');", "      console.error('Error leyendo citas de Supabase:', error);\n      onToast('No se pudieron cargar las citas desde Supabase.', 'error');"),
            ("      if (!suppressCitaPersistenceRef.current && hydratedCitasRef.current && auth.currentUser) {\n        const uid = auth.currentUser.uid;\n        void Promise.all(next.map((item, index) => {\n          const stableId = (item as ScheduledCita & { id?: string }).id || `${uid}_${item.citaDia}_${item.citaHora}_${index}`.replace(/[^a-zA-Z0-9_-]/g, '_');\n          return createDocument('appointments', stableId, item as any);\n        })).catch(error => {\n          console.error('Error guardando citas en Firestore:', error);\n          onToast('No se pudieron guardar las citas en Firebase.', 'error');\n        });\n      }\n      return next;", "      const withIds = next.map(item => item.id ? item : { ...item, id: crypto.randomUUID() });\n      if (!suppressCitaPersistenceRef.current && hydratedCitasRef.current) {\n        const nextIds = new Set(withIds.map(item => item.id));\n        const removed = previous.filter(item => item.id && !nextIds.has(item.id));\n        void Promise.all([\n          ...withIds.map(item => createDocument('citas', item.id!, item as any)),\n          ...removed.map(item => deleteDocument('citas', item.id!)),\n        ]).catch(error => {\n          console.error('Error guardando citas en Supabase:', error);\n          onToast('No se pudieron guardar las citas en Supabase.', 'error');\n        });\n      }\n      return withIds;"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected block not found: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify legacy imports removed from citas
        run: |
          ! grep -nE "src/lib/firebase|firestoreService|firebase/firestore|Firestore:|desde Firebase" components/GestionCitas.tsx
          grep -n "useCallback" components/GestionCitas.tsx
      - name: Commit codemod
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/GestionCitas.tsx
          git commit -m 'refactor: move GestionCitas directly to Supabase'
          git push origin HEAD:feat/firebase-multiusuario
