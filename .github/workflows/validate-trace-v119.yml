name: Validation GestionProfea Traceability V2

on:
  push:
    branches:
      - 'validation/gestionprofea-trace-v1-19-0-20261003'

permissions:
  contents: read

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and verify V2 package
        run: |
          set -euo pipefail
          cat .validation/pkg.part*.txt | base64 --decode > /tmp/gestionprofea-v2.zip
          echo "06c4e8015422862e82d30308b7289f22bd1ff5bfb585e472b91552ff8ab1373d  /tmp/gestionprofea-v2.zip" | sha256sum -c -
          rm -rf /tmp/gestionprofea-v2
          mkdir -p /tmp/gestionprofea-v2
          unzip -q /tmp/gestionprofea-v2.zip -d /tmp/gestionprofea-v2
          test -s /tmp/gestionprofea-v2/gestionprofea-trazabilidad-v2-1.19.0/apply-v2.mjs

      - name: Apply V2 on runner checkout
        run: |
          set -euo pipefail
          node /tmp/gestionprofea-v2/gestionprofea-trazabilidad-v2-1.19.0/apply-v2.mjs "$GITHUB_WORKSPACE"
          test "$(node -p "require('./package.json').version")" = "1.19.0"
          test -s supabase/migrations/20261003090000_mandatory_traceability_v2.sql
          test -s src/lib/mandatoryTraceabilityV2.ts
          test -s src/services/mandatoryTraceabilityServiceV2.ts

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Supabase-only and auth architecture regression
        run: |
          set -euo pipefail
          test ! -f src/lib/firebase.ts
          test ! -f src/services/firestoreService.ts
          if grep -RniE "src/lib/firebase|services/firestoreService|from ['\"]firebase(/|['\"])|FirebaseSyncModal|DatabaseSyncAlert|triggerFirestoreDatabaseSync|/api/database/save-workers-batch|/api/database/delete-worker|personasPROFEA_(groupId|activeWorkspace|activeWorkspaceId|lastSyncTime|isSyncing|syncMode|syncEmail)|Object.assign\(globalThis as any|executeDatabaseSync|handleSyncPendingToCloud|currentEffectiveWorkspaceId|getOrCreateUserWorkspace|syncWorkerToWorkspace|syncWorkerToCloud|getOrCreateSyncGroup|fetchGroupData|subscribeToWorkspace" App.tsx index.tsx components src server api --include='*.ts' --include='*.tsx' --exclude='*.map' 2>/dev/null; then
            echo 'Legacy Firebase/manual synchronization/workspace compatibility code detected.'
            exit 1
          fi
          grep -q '"@supabase/supabase-js"' package.json
          grep -q "signOut({ scope: 'local' })" src/lib/authService.ts
          grep -q 'autoRefreshToken: true' src/lib/supabase.ts
          grep -q 'persistSession: true' src/lib/supabase.ts

      - name: Historical regression suite
        run: |
          set -euo pipefail
          npm run test:mandatory-signatures
          npx tsx scripts/testSupervisorSignedPdfDownload.ts
          npm run test:relation-ordering
          npx tsx scripts/testMandatoryWorksiteClassification.ts
          npx tsx scripts/testForemanAttendancePeriodFilter.ts
          npm run test:mandatory-worker-detection
          npm run test:modal-layering
          npm run test:theme-contrast
          npm run test:global-modal-stack
          npm run test:global-modal-audit

      - name: Traceability V2 regression suite
        run: |
          set -euo pipefail
          npm run test:mandatory-traceability-v2
          npm run test:mandatory-traceability-integration-v2
          npm run test:mandatory-traceability-sql-v2
          npm run test:mandatory-traceability-e2e-v2
          npm run validate:mandatory-traceability-v2

      - name: TypeScript validation
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Smoke test production server
        run: |
          set -euo pipefail
          NODE_ENV=production node dist/server.cjs > /tmp/profea-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ -o /tmp/profea-index.html; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/profea-server.log
              exit 1
            fi
            sleep 0.5
          done
          test -s /tmp/profea-index.html
          curl --fail --silent --show-error http://127.0.0.1:3000/manifest.webmanifest -o /tmp/profea-manifest.json
          curl --fail --silent --show-error http://127.0.0.1:3000/manifest-encargados.webmanifest -o /tmp/profea-foreman-manifest.json
          curl --fail --silent --show-error http://127.0.0.1:3000/encargados -o /tmp/profea-foreman.html
          curl --fail --silent --show-error http://127.0.0.1:3000/service-worker.js -o /tmp/profea-service-worker.js
          grep -q '"name": "PROFEA"' /tmp/profea-manifest.json
          grep -q '"name": "PFEA Encargados"' /tmp/profea-foreman-manifest.json
          test -s /tmp/profea-foreman.html
          grep -q 'CACHE_NAME' /tmp/profea-service-worker.js
          if grep -E 'vendor-(pdf-export|pdf-viewer|spreadsheets|ocr|charts|motion)' dist/index.html; then
            echo 'Heavy optional vendor bundle is being eagerly preloaded from the initial page.'
            exit 1
          fi
          echo "Production and foreman portal smoke tests passed."
