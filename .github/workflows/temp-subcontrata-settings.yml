name: Temp subcontractor settings migration

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-subcontrata-settings.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_subcontrata_settings_fix.py
      - name: Verify no Subcontratas local storage helpers remain in component
        run: |
          ! grep -n "getStoredChecklistTemplate\|saveStoredChecklistTemplate\|getStoredReporteTecnicoConfig\|saveStoredReporteTecnicoConfig\|getStoredObrasRecursosPreventivos\|saveStoredObraRecursoPreventivo\|deleteStoredObraRecursoPreventivo\|updateStoredObraNameInRecursos" components/SubcontratasSection.tsx
          grep -n "loadSubcontrataSettings\|saveSubcontrataSettings" components/SubcontratasSection.tsx
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit migrated code and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_subcontrata_settings_fix.py .github/workflows/temp-subcontrata-settings.yml
          git add -A
          git commit -m 'refactor: persist subcontractor settings in Supabase'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
