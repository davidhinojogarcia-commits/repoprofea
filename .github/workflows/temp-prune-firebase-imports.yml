name: Temp prune firebase imports

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-prune-firebase-imports.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_prune_firebase_imports.py
      - name: Show remaining legacy imports
        run: grep -n "from './src/lib/firebase'" App.tsx || true
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit pruning and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_prune_firebase_imports.py .github/workflows/temp-prune-firebase-imports.yml
          git add -A
          git commit -m 'refactor: prune unused firebase compatibility imports'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
