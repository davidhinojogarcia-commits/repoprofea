name: Fix import persistence

on:
  push:
    branches: ['feat/firebase-multiusuario']

permissions:
  contents: write

jobs:
  codemod:
    if: github.event.head_commit.message == 'chore: apply import persistence repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/firebase-multiusuario
      - name: Persist imported workers directly to Supabase
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('App.tsx')
          s=p.read_text()
          anchor="import { detectImportDuplicates, DuplicateMatch } from './src/lib/duplicateFilter';"
          if "./src/services/databaseService" not in s:
              s=s.replace(anchor, anchor+"\nimport { createDocument } from './src/services/databaseService';",1)
          s=s.replace("  const commitAddMultipleWorkers = (\n", "  const commitAddMultipleWorkers = async (\n",1)
          marker="    setPeopleWithHistory(prev => [...prev, ...formattedWorkers]);\n"
          insert="""    setPeopleWithHistory(prev => [...prev, ...formattedWorkers]);\n\n    try {\n      await Promise.all(formattedWorkers.map(person =>\n        createDocument('workers', person.id, person as any)\n      ));\n    } catch (error) {\n      const importedIds = new Set(formattedWorkers.map(person => person.id));\n      setPeopleWithHistory(prev => prev.filter(person => !importedIds.has(person.id)), false);\n      console.error('Error persistiendo trabajadores importados en Supabase:', error);\n      setToast({ message: 'La importación no se ha guardado en la base de datos. No se han aplicado cambios.', type: 'error' });\n      return;\n    }\n"""
          if marker not in s:
              raise SystemExit('setPeopleWithHistory import marker not found')
          s=s.replace(marker,insert,1)
          start=s.find("    const targetImportWsId = (currentEffectiveWorkspaceId || DEFAULT_WORKSPACE_ID).trim();")
          end=s.find("\n  };\n\n  const handleAddMultipleWorkers", start)
          if start<0 or end<0:
              raise SystemExit('legacy import sync block not found')
          s=s[:start]+s[end:]
          s=s.replace("  const handleAddMultipleWorkers = (\n", "  const handleAddMultipleWorkers = async (\n",1)
          s=s.replace("    commitAddMultipleWorkers(newWorkers, 0);\n", "    await commitAddMultipleWorkers(newWorkers, 0);\n",1)
          s=s.replace("                commitAddMultipleWorkers(unique, skipped);", "                void commitAddMultipleWorkers(unique, skipped);")
          s=s.replace("                commitAddMultipleWorkers(all, 0);", "                void commitAddMultipleWorkers(all, 0);")
          p.write_text(s)
          PY
      - name: Verify import writes bypass legacy sync
        run: |
          grep -n "createDocument('workers'" App.tsx
          ! grep -A45 -n "const commitAddMultipleWorkers" App.tsx | grep -E "syncWorkerToWorkspace|syncWorkerToCloud|Firebase Firestore"
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.tsx
          git commit -m 'fix: persist imported workers directly in Supabase'
          git push origin HEAD:feat/firebase-multiusuario
