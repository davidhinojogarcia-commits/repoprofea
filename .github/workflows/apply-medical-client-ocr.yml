name: Apply medical client OCR fallback

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-medical-client-ocr.py'
      - '.github/workflows/apply-medical-client-ocr.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch-medical-client-ocr.py
      - name: Commit fix and cleanup
        run: |
          rm -f scripts/patch-medical-client-ocr.py .github/workflows/apply-medical-client-ocr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ReconocimientosMedicosSection.tsx api/parse-medical-records.ts scripts/patch-medical-client-ocr.py .github/workflows/apply-medical-client-ocr.yml
          git commit -m "fix: use local OCR before medical AI providers" || exit 0
          git push origin main
