name: One-off fix CAE review header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-fix-cae-review-header.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
      - run: python scripts/fix_cae_review_header.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: |
          grep -n "profea-cae-review-header" components/ChecklistReviewModal.tsx
          grep -n "CAE AI review modal" notification-modal-layout.css
      - run: git rm -f .github/workflows/oneoff-fix-cae-review-header.yml scripts/fix_cae_review_header.py
      - run: |
          git config user.name "davidhinojogarcia-commits"
          git config user.email "davidhinojogarcia@gmail.com"
          git add components/ChecklistReviewModal.tsx notification-modal-layout.css
          git commit -m "fix: restore visible CAE review modal header"
          git push origin main
