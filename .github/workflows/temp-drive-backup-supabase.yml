name: Temp Drive backup Supabase

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-drive-backup-supabase.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_drive_backup_supabase.py
      - name: Verify Drive backup source
        run: |
          grep -n "buildSupabaseSystemBackup" src/lib/driveBackup.ts
          ! grep -n "profea_subcontratas_v1" src/lib/driveBackup.ts
          grep -n "await buildCompleteSystemBackup" App.tsx
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit migration and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_drive_backup_supabase.py .github/workflows/temp-drive-backup-supabase.yml
          git add -A
          git commit -m 'fix: build Drive backups from Supabase'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
