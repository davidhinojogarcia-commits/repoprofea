name: Temp remove legacy server backend

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-remove-legacy-server.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_remove_legacy_server.py
      - name: Verify legacy backend removal
        run: |
          test ! -f server/databaseStore.ts
          test ! -f server/accountStore.ts
          ! grep -nE "databaseStore|accountStore|/api/database/|/api/auth/" server.ts
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit cleanup and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_remove_legacy_server.py .github/workflows/temp-remove-legacy-server.yml .github/workflows/temp-audit-legacy-server.yml
          git add -A
          git commit -m 'chore: remove unused local database and account backend'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
