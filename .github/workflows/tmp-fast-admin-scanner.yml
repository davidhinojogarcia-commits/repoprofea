name: Temporary fast administrative scanner patch

on:
  push:
    branches:
      - work/fast-admin-scanner
    paths:
      - '.github/workflows/tmp-fast-admin-scanner.yml'
      - '.github/scripts/patch_fast_admin_scanner.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fast-admin-scanner
      - name: Apply scanner performance patch
        run: python3 .github/scripts/patch_fast_admin_scanner.py
      - name: Verify TypeScript and build
        run: npm ci && npm run build
      - name: Commit scanner optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CameraScannerModal.tsx components/RegistrationForm.tsx
          git diff --cached --quiet && exit 0
          git commit -m "perf: speed up administrative OCR and verify DNI identity"
          git push origin HEAD:work/fast-admin-scanner
