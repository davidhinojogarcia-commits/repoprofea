name: Temp app settings Supabase migration

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-app-settings-supabase.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_app_settings_supabase.py
      - name: Verify Supabase settings are authoritative
        run: |
          ! grep -n "localStorage.getItem('obrasGuardadas'\|localStorage.getItem('lugaresFormacion'\|localStorage.getItem('sitiosReconocimiento'\|localStorage.getItem('telefonosGuardados'\|localStorage.getItem('categoriasGuardadas'\|localStorage.getItem('workStartHour'\|localStorage.getItem('workEndHour'" App.tsx
          ! grep -n "localStorage.setItem('obrasGuardadas'\|localStorage.setItem('lugaresFormacion'\|localStorage.setItem('sitiosReconocimiento'\|localStorage.setItem('telefonosGuardados'\|localStorage.setItem('categoriasGuardadas'\|localStorage.setItem('workStartHour'\|localStorage.setItem('workEndHour'" App.tsx
          grep -n "loadAppBusinessSettings\|saveAppBusinessSettings\|clearLegacyBusinessSettings" App.tsx
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit migration and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_app_settings_supabase.py .github/workflows/temp-app-settings-supabase.yml
          git add -A
          git commit -m 'refactor: persist business settings in Supabase'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
      # rerun after import-safety fix
