name: Repair Firebase source

on:
  push:
    branches: ['feat/firebase-multiusuario']

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip firebase repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/firebase-multiusuario
          fetch-depth: 0
      - name: Repair malformed workspace compatibility function
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib/firebase.ts')
          text = path.read_text()
          marker = '/**\n * Adds an authorized coworker email to a workspace\n */'
          start = text.find('export async function getOrCreateUserWorkspace')
          end = text.find(marker, start)
          if start < 0 or end < 0:
              raise SystemExit('workspace function markers not found')

          clean = '''export async function getOrCreateUserWorkspace(user: { uid: string; email: string; displayName?: string | null; photoURL?: string | null }): Promise<Workspace> {
            const email = (user.email || '').trim().toLowerCase();
            const id = canonicalizeEmailKey(email);
            return {
              id,
              name: `Espacio de ${user.displayName || email.split('@')[0] || 'Usuario'}`,
              ownerEmail: email,
              ownerUid: user.uid,
              ownerName: user.displayName || email.split('@')[0] || 'Usuario',
              ownerPhoto: user.photoURL || '',
              sharedWith: [],
              sharedWithEmails: [email],
              accessCode: '',
              createdAt: new Date().toISOString(),
              lastSyncAt: new Date().toISOString()
            };
          }

          '''
          text = text[:start] + clean + text[end:]
          path.write_text(text)
          PY
      - name: Verify TypeScript source syntax
        run: |
          npm install --package-lock-only --ignore-scripts
          npx tsc --noEmit --pretty false
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/firebase.ts package-lock.json
          git commit -m 'fix: repair firebase source [skip firebase repair] [skip firestore migration]'
          git push origin feat/firebase-multiusuario
