name: Temporary rename summary buttons

on:
  push:
    branches: [work/resumen-renombres-pendientes]
    paths:
      - '.github/workflows/tmp-rename-summary-buttons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename summary buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/Stats.tsx')
          s = p.read_text()
          replacements = {
              'Exportar Resumen PDF': 'Resumen estadístico formaciones',
              'Generar Informe Periódico': 'Análisis mano de obra',
              'Exportar Resumen de Obra': 'Relación nominal de trabajadores por obra',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected label not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/Stats.tsx
          git commit -m 'ui: rename summary export buttons'
          git push
