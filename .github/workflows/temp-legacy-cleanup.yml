name: Temp legacy cleanup

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-legacy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_legacy_cleanup.py
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit cleanup and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_legacy_cleanup.py .github/workflows/temp-legacy-cleanup.yml
          git add -A
          git commit -m 'refactor: remove obsolete local persistence helpers' || true
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
