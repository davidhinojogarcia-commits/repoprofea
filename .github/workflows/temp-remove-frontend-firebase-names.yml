name: Temp remove frontend Firebase names

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-remove-frontend-firebase-names.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_remove_frontend_firebase_names.py
      - name: Verify compatibility file removal
        run: |
          test ! -f src/lib/firebase.ts
          test ! -f src/services/firestoreService.ts
          ! grep -RInE "src/lib/firebase|services/firestoreService|from ['\"]firebase(/|['\"])" --include='*.ts' --include='*.tsx' . --exclude-dir=node_modules --exclude-dir=.git
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit cleanup and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_remove_frontend_firebase_names.py .github/workflows/temp-remove-frontend-firebase-names.yml
          git add -A
          git commit -m 'chore: remove frontend Firebase compatibility paths'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
