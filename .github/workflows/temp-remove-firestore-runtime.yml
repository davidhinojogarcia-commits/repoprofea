name: Temp remove Firestore runtime

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-remove-firestore-runtime.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_remove_firestore_runtime.py
      - name: Remove Firebase web SDK dependency if no runtime imports remain
        run: |
          if ! grep -RInE "from ['\"]firebase(/|['\"])|from ['\"]firebase/app['\"]|from ['\"]firebase/firestore['\"]" --include='*.ts' --include='*.tsx' . --exclude-dir=node_modules --exclude-dir=.git; then
            npm uninstall firebase
          else
            echo 'Firebase imports remain; keeping package for now.'
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit cleanup and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_remove_firestore_runtime.py .github/workflows/temp-remove-firestore-runtime.yml
          git add -A
          git commit -m 'chore: remove unused Firestore server runtime'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
