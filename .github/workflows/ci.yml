name: CI

on:
  push:
    branches: ['main', 'feat/firebase-multiusuario']
  pull_request:
    branches: ['main']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-off CAE checklist-only patch
        if: github.ref == 'refs/heads/main'
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path('components/FileUploaderIA.tsx')
          text = path.read_text()
          marker = '[NO LOCALIZADO POR OCR/IA] No se ha encontrado evidencia documental suficiente para acreditar este punto en los archivos aportados.'
          if marker not in text:
              print('CAE checklist-only patch already applied; nothing to do.')
              raise SystemExit(0)

          old = '''        if (!doc) {
          const keepNotApplicable = item.estado === 'no_aplica' && !item.obligatorio;
          return {
            docId: item.id,
            nombre: item.nombre,
            categoria: item.categoria,
            normativa: item.normativa,
            obligatorio: item.obligatorio,
            estadoActual: item.estado,
            estadoPropuesto: keepNotApplicable ? 'no_aplica' : 'pendiente',
            fechaEntregaActual: item.fechaEntrega,
            fechaEntregaPropuesta: item.fechaEntrega,
            fechaCaducidadActual: item.fechaCaducidad,
            fechaCaducidadPropuesta: item.fechaCaducidad,
            observacionesActuales: item.observaciones,
            observacionesPropuestas: keepNotApplicable
              ? (item.observaciones || 'No aplica según la configuración actual del checklist.')
              : '[NO LOCALIZADO POR OCR/IA] No se ha encontrado evidencia documental suficiente para acreditar este punto en los archivos aportados.',
            archivoOrigen: keepNotApplicable ? '' : 'No localizado en los documentos aportados',
            esLegible: true,
            validezIA: keepNotApplicable ? 'NO APLICA' : 'NO LOCALIZADO POR OCR/IA',
            confianza: keepNotApplicable ? 'alta' : 'baja',
            selected: true
          } as ProposedChecklistChange;
        }
'''
          new = '''        if (!doc) {
          // No evidence in this upload means "leave this checklist item as-is".
          // Never downgrade an existing item or inject synthetic OCR/AI observations.
          return {
            docId: item.id,
            nombre: item.nombre,
            categoria: item.categoria,
            normativa: item.normativa,
            obligatorio: item.obligatorio,
            estadoActual: item.estado,
            estadoPropuesto: item.estado,
            fechaEntregaActual: item.fechaEntrega,
            fechaEntregaPropuesta: item.fechaEntrega,
            fechaCaducidadActual: item.fechaCaducidad,
            fechaCaducidadPropuesta: item.fechaCaducidad,
            observacionesActuales: item.observaciones,
            observacionesPropuestas: item.observaciones || '',
            archivoOrigen: '',
            esLegible: true,
            validezIA: item.estado === 'no_aplica' ? 'NO APLICA' : 'SIN CAMBIOS',
            confianza: 'baja',
            selected: false
          } as ProposedChecklistChange;
        }
'''
          if old not in text:
              raise SystemExit('Expected CAE block not found; refusing unsafe patch.')
          text = text.replace(old, new, 1)
          text = text.replace("        else if (!observaciones) observaciones = `[EVIDENCIA OCR/IA] Documento localizado y cotejado. Archivo: '${doc.archivoOrigen || ''}'.`;", "        else if (!observaciones) observaciones = item.observaciones || '';", 1)
          text = text.replace("          : `EVIDENCIA OCR/IA (${doc.confianza || 'media'})`;", "          : `VERIFICADO (${doc.confianza || 'media'})`;", 1)
          text = text.replace("          fechaEntregaPropuesta: doc.fechaEmision || item.fechaEntrega || new Date().toISOString().slice(0, 10),", "          fechaEntregaPropuesta: doc.fechaEmision || item.fechaEntrega || '',", 1)
          text = text.replace("        detectadoPorIA: confirmed.estadoPropuesto !== 'pendiente' && confirmed.archivoOrigen !== 'No localizado en los documentos aportados',", "        detectadoPorIA: !!confirmed.archivoOrigen && confirmed.estadoPropuesto !== 'pendiente',", 1)
          text = text.replace("        validezIA: confirmed.validezIA || (confirmed.estadoPropuesto === 'caducado' ? 'CADUCADO' : confirmed.estadoPropuesto === 'pendiente' ? 'NO LOCALIZADO POR OCR/IA' : 'Verificado por IA'),", "        validezIA: confirmed.validezIA || (confirmed.estadoPropuesto === 'caducado' ? 'CADUCADO' : confirmed.estadoPropuesto === 'pendiente' ? 'PENDIENTE' : 'VERIFICADO'),", 1)
          text = text.replace("                Importe la documentación completa de la subcontrata: la IA extrae evidencias, vigencias y personal detectado exclusivamente desde su propio expediente.", "                Importe documentación y se cotejará exclusivamente contra los puntos del checklist configurado.", 1)
          text = text.replace("                La IA comprobará validez de fechas legales y cotejará la lista de operarios con la obra '{subcontrata.obra}'.", "                El análisis solo buscará evidencia para los puntos del checklist. Lo no encontrado no modificará el estado existente.", 1)
          text = text.replace("                    <span>Verificar Documentos contra el Checklist Legal</span>", "                    <span>Comprobar Checklist</span>", 1)
          text = text.replace("      onToast(`OCR/IA finalizado: ${convertedFiles.length} archivo(s) analizados y ${proposedList.length} puntos del checklist preparados para revisión manual.`, 'success');", "      onToast(`Checklist analizado: ${convertedFiles.length} archivo(s) procesados y ${proposedList.filter(item => item.selected).length} punto(s) con evidencia propuestos para revisión.`, 'success');", 1)

          if 'NO LOCALIZADO POR OCR/IA' in text or 'No localizado en los documentos aportados' in text:
              raise SystemExit('Synthetic no-localizado text still present after patch.')

          path.write_text(text)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', str(path)], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: make CAE analysis checklist-only'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Supabase-only runtime
        run: |
          test ! -f src/lib/firebase.ts
          test ! -f src/services/firestoreService.ts
          if grep -RniE "src/lib/firebase|services/firestoreService|from ['\"]firebase(/|['\"])|FirebaseSyncModal|DatabaseSyncAlert|triggerFirestoreDatabaseSync|/api/database/save-workers-batch|/api/database/delete-worker|personasPROFEA_(groupId|activeWorkspace|activeWorkspaceId|lastSyncTime|isSyncing|syncMode|syncEmail)|Object.assign\(globalThis as any|executeDatabaseSync|handleSyncPendingToCloud|currentEffectiveWorkspaceId|getOrCreateUserWorkspace|syncWorkerToWorkspace|syncWorkerToCloud|getOrCreateSyncGroup|fetchGroupData|subscribeToWorkspace" App.tsx index.tsx components src server api --include='*.ts' --include='*.tsx' --exclude='*.map' 2>/dev/null; then
            echo 'Legacy Firebase/manual synchronization/workspace compatibility code detected.'
            exit 1
          fi
          if grep -RniE "['\"]workers['\"]" App.tsx index.tsx components src server api --include='*.ts' --include='*.tsx' --exclude='*.map' 2>/dev/null; then
            echo 'Legacy workers runtime table reference detected.'
            exit 1
          fi
          if grep -RniE "localStorage\.(getItem|setItem|removeItem)\(['\"](personasPROFEA|personasEliminadasPROFEA|obrasGuardadas|lugaresFormacion|sitiosReconocimiento|telefonosGuardados|categoriasGuardadas|workStartHour|workEndHour|profea_subcontratas_v1|profea_subcontratas_checklist_template|profea_reporte_tecnico_config|profea_obras_recursos_preventivos|pdfCustomConfig)['\"]" App.tsx components src --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo 'Business data must not use localStorage.'
            exit 1
          fi
      - name: Validate auth session architecture
        run: |
          grep -q '"@supabase/supabase-js"' package.json
          if grep -RniE "/auth/v1/(token|logout)" App.tsx index.tsx components src server api --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo 'Manual Supabase token/logout endpoint usage is forbidden.'
            exit 1
          fi
          if grep -RniE "supabase\.auth\.signOut\(\)" App.tsx index.tsx components src server api --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo 'Supabase signOut must explicitly use local scope for normal session logout.'
            exit 1
          fi
          grep -q "signOut({ scope: 'local' })" src/lib/authService.ts
          grep -q 'autoRefreshToken: true' src/lib/supabase.ts
          grep -q 'persistSession: true' src/lib/supabase.ts
          grep -q 'IDLE_TIMEOUT_MS = 30 \* 60 \* 1000' src/hooks/useIdleTimeout.ts
          grep -q 'IDLE_WARNING_MS = 2 \* 60 \* 1000' src/hooks/useIdleTimeout.ts
      - name: TypeScript validation
        run: npm run lint
      - name: Build application
        run: npm run build
