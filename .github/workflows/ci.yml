name: CI

on:
  push:
    branches: ['main', 'feat/firebase-multiusuario']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply traceability V2 validation package
        run: |
          set -euo pipefail
          cat .validation/pkg.part*.txt | base64 -d > /tmp/trace-v2.zip
          echo "06c4e8016025204b1025ed4a67440cb2a2e667688175d01930d0653398ab5e16  /tmp/trace-v2.zip" | sha256sum -c -
          rm -rf /tmp/trace-v2
          mkdir -p /tmp/trace-v2
          unzip -q /tmp/trace-v2.zip -d /tmp/trace-v2
          PKG=/tmp/trace-v2/gestionprofea-trazabilidad-v2-1.19.0
          test -s "$PKG/apply-v2.mjs"
          node "$PKG/scripts/verifyMandatoryTraceabilityPackageV2.mjs"
          git show a5b3c6be5f397494f5a3100cf508740658dd64c2:.github/workflows/ci.yml > .github/workflows/ci.yml
          node "$PKG/apply-v2.mjs" "$GITHUB_WORKSPACE"
          grep -q '"version": "1.19.0"' package.json
          test -s supabase/migrations/20261003090000_mandatory_traceability_v2.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Supabase-only runtime
        run: |
          test ! -f src/lib/firebase.ts
          test ! -f src/services/firestoreService.ts
          if grep -RniE "src/lib/firebase|services/firestoreService|from ['\"]firebase(/|['\"])|FirebaseSyncModal|DatabaseSyncAlert|triggerFirestoreDatabaseSync|/api/database/save-workers-batch|/api/database/delete-worker|personasPROFEA_(groupId|activeWorkspace|activeWorkspaceId|lastSyncTime|isSyncing|syncMode|syncEmail)|Object.assign\(globalThis as any|executeDatabaseSync|handleSyncPendingToCloud|currentEffectiveWorkspaceId|getOrCreateUserWorkspace|syncWorkerToWorkspace|syncWorkerToCloud|getOrCreateSyncGroup|fetchGroupData|subscribeToWorkspace" App.tsx index.tsx components src server api --include='*.ts' --include='*.tsx' --exclude='*.map' 2>/dev/null; then
            echo 'Legacy Firebase/manual synchronization/workspace compatibility code detected.'
            exit 1
          fi
          if grep -RniE "(supabase\.query|canonicalTable|collection|subscribeToDocuments|getDocuments|createDocument|updateDocument|deleteDocument)\([^)]*['\"]workers['\"]" App.tsx index.tsx components src server api --include='*.ts' --include='*.tsx' --exclude='*.map' 2>/dev/null; then
            echo 'Legacy workers runtime table reference detected.'
            exit 1
          fi
          if grep -RniE "localStorage\.(getItem|setItem|removeItem)\(['\"](personasPROFEA|personasEliminadasPROFEA|obrasGuardadas|lugaresFormacion|sitiosReconocimiento|telefonosGuardados|categoriasGuardadas|workStartHour|workEndHour|profea_subcontratas_v1|profea_subcontratas_checklist_template|profea_reporte_tecnico_config|profea_obras_recursos_preventivos|pdfCustomConfig)['\"]" App.tsx components src --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo 'Business data must not use localStorage.'
            exit 1
          fi
      - name: Validate auth session architecture
        run: |
          grep -q '"@supabase/supabase-js"' package.json
          if grep -RniE "/auth/v1/(token|logout)" App.tsx index.tsx components src server api --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo 'Manual Supabase token/logout endpoint usage is forbidden.'
            exit 1
          fi
          if grep -RniE "supabase\.auth\.signOut\(\)" App.tsx index.tsx components src server api --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo 'Supabase signOut must explicitly use local scope for normal session logout.'
            exit 1
          fi
          grep -q "signOut({ scope: 'local' })" src/lib/authService.ts
          grep -q 'autoRefreshToken: true' src/lib/supabase.ts
          grep -q 'persistSession: true' src/lib/supabase.ts
          grep -q 'IDLE_TIMEOUT_MS = 30 \* 60 \* 1000' src/hooks/useIdleTimeout.ts
          grep -q 'IDLE_WARNING_MS = 2 \* 60 \* 1000' src/hooks/useIdleTimeout.ts
      - name: Validate foreman document integrity
        run: |
          set -euo pipefail
          MIGRATION=supabase/migrations/20260929193000_harden_foreman_imported_signature_integrity.sql
          test -s "$MIGRATION"
          grep -q "for update;" "$MIGRATION"
          grep -q "importedWorkerIds" "$MIGRATION"
          grep -q "Faltan firmas de personas incluidas en el documento importado" "$MIGRATION"
          grep -q "count(distinct imported_id)" "$MIGRATION"
          grep -q "currentDetails.importedWorkerIds" src/services/foremanPortalService.ts
          if grep -q ">Mostrar todos</button>" components/ForemanMobilePortal.tsx; then
            echo 'Misleading period selector label detected.'
            exit 1
          fi
      - name: Validate exact imported PDF preservation
        run: |
          set -euo pipefail
          MIGRATION=supabase/migrations/20260929203000_exact_original_mandatory_pdf.sql
          test -s "$MIGRATION"
          grep -q "foreman_mandatory_pdf_files" "$MIGRATION"
          grep -q "original_pdf bytea" "$MIGRATION"
          grep -q "signed_pdf bytea" "$MIGRATION"
          grep -q "guard_exact_mandatory_pdf_completion" "$MIGRATION"
          grep -q "workerAnchors" "$MIGRATION"
          grep -q "buildSignedMandatoryPdf" src/lib/mandatoryPdfOverlay.ts
          grep -q "verifyMandatoryPdfFidelity" src/lib/mandatoryPdfOverlay.ts
          grep -q "originalPdfMode === 'overlay'" src/lib/foremanDocumentsPdf.ts
          grep -q "getSupervisorMandatoryPdf" components/ForemanDocumentsDashboard.tsx
          grep -q "get_foreman_mandatory_signatures" "$MIGRATION"
          grep -q "getForemanMandatorySignatures" components/ForemanMobilePortal.tsx
      - name: Mandatory signature anchoring regression
        run: npm run test:mandatory-signatures
      - name: Supervisor signed PDF download regression
        run: npx tsx scripts/testSupervisorSignedPdfDownload.ts

      - name: Worker relation ordering regression
        run: npm run test:relation-ordering
      - name: Mandatory worksite classification regression
        run: npx tsx scripts/testMandatoryWorksiteClassification.ts

      - name: Foreman attendance period filter regression
        run: npx tsx scripts/testForemanAttendancePeriodFilter.ts

      - name: Mandatory traceability V2 model regression
        run: npm run test:mandatory-traceability-v2
      - name: Mandatory traceability V2 integration regression
        run: npm run test:mandatory-traceability-integration-v2
      - name: Mandatory traceability V2 SQL regression
        run: npm run test:mandatory-traceability-sql-v2
      - name: Mandatory traceability V2 E2E regression
        run: npm run test:mandatory-traceability-e2e-v2
      - name: Mandatory worker detection regression
        run: npm run test:mandatory-worker-detection
      - name: Global modal layering regression
        run: npm run test:modal-layering
      - name: Light/dark contrast regression
        run: npm run test:theme-contrast
      - name: Global modal stack audit
        run: npm run test:global-modal-stack
      - name: Global full-screen modal audit
        run: npm run test:global-modal-audit
      - name: TypeScript validation
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee tsc-output.log
      - name: Upload TypeScript diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics-${{ github.run_id }}
          path: tsc-output.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Build application
        run: npm run build
      - name: Smoke test production server
        run: |
          set -euo pipefail
          NODE_ENV=production node dist/server.cjs > /tmp/profea-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ -o /tmp/profea-index.html; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/profea-server.log
              exit 1
            fi
            sleep 0.5
          done
          test -s /tmp/profea-index.html
          curl --fail --silent --show-error http://127.0.0.1:3000/manifest.webmanifest -o /tmp/profea-manifest.json
          curl --fail --silent --show-error http://127.0.0.1:3000/manifest-encargados.webmanifest -o /tmp/profea-foreman-manifest.json
          curl --fail --silent --show-error http://127.0.0.1:3000/encargados -o /tmp/profea-foreman.html
          curl --fail --silent --show-error http://127.0.0.1:3000/service-worker.js -o /tmp/profea-service-worker.js
          grep -q '"name": "PROFEA"' /tmp/profea-manifest.json
          grep -q '"name": "PFEA Encargados"' /tmp/profea-foreman-manifest.json
          test -s /tmp/profea-foreman.html
          grep -q 'CACHE_NAME' /tmp/profea-service-worker.js
          if grep -E 'vendor-(pdf-export|pdf-viewer|spreadsheets|ocr|charts|motion)' dist/index.html; then
            echo 'Heavy optional vendor bundle is being eagerly preloaded from the initial page.'
            exit 1
          fi
          echo "Production and foreman portal smoke tests passed."
