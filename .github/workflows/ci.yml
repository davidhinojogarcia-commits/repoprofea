name: CI

on:
  push:
    branches: ['main', 'feat/firebase-multiusuario']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Firebase source migration
        run: |
          if grep -nE '^\}\): Promise<' src/lib/firebase.ts; then
            echo 'Malformed Firebase function signature detected.'
            exit 1
          fi
          count=$(grep -c '^export async function getOrCreateUserWorkspace' src/lib/firebase.ts || true)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one getOrCreateUserWorkspace declaration, found $count."
            exit 1
          fi
      - run: npm run build
      - name: Install Firebase Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Build Firebase Functions
        working-directory: functions
        run: npm run build
