name: Temporary PROFEA PWA install fix

on:
  push:
    branches:
      - work/resumen-renombres-pendientes
    paths:
      - '.github/workflows/tmp-fix-pwa-install.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate PWA icons from corporate logo
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('public/logo-diputacion-profea.png')
          out = Path('public/icons')
          out.mkdir(parents=True, exist_ok=True)
          logo = Image.open(src).convert('RGBA')

          def square_icon(size:int, margin_ratio:float, name:str):
              bg = Image.new('RGBA', (size,size), (255,255,255,255))
              margin = int(size * margin_ratio)
              max_w = size - 2*margin
              max_h = size - 2*margin
              scale = min(max_w/logo.width, max_h/logo.height)
              w = max(1, int(logo.width*scale)); h=max(1,int(logo.height*scale))
              resized = logo.resize((w,h), Image.Resampling.LANCZOS)
              x=(size-w)//2; y=(size-h)//2
              bg.alpha_composite(resized,(x,y))
              bg.convert('RGB').save(out/name, 'PNG', optimize=True)

          for size in (72,96,128,144,152,180,192,384,512):
              square_icon(size, 0.10, f'icon-{size}.png')
          for size in (192,512):
              square_icon(size, 0.20, f'icon-maskable-{size}.png')
          square_icon(180, 0.10, 'apple-touch-icon.png')
          square_icon(32, 0.06, 'favicon-32x32.png')
          square_icon(16, 0.04, 'favicon-16x16.png')
          ico_src = Image.open(out/'favicon-32x32.png').convert('RGBA')
          ico_src.save('public/favicon.ico', sizes=[(16,16),(32,32),(48,48)])
          PY

      - name: Patch manifest and metadata
        run: |
          cat > public/manifest.webmanifest <<'EOF'
          {
            "id": "/",
            "name": "PROFEA",
            "short_name": "PROFEA",
            "description": "Sistema de Gestión PROFEA de la Diputación Provincial de Cádiz",
            "lang": "es",
            "start_url": "/",
            "scope": "/",
            "display": "standalone",
            "display_override": ["window-controls-overlay", "standalone"],
            "background_color": "#ffffff",
            "theme_color": "#00548E",
            "orientation": "any",
            "categories": ["business", "productivity"],
            "icons": [
              { "src": "/icons/icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any" },
              { "src": "/icons/icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any" },
              { "src": "/icons/icon-maskable-192.png", "sizes": "192x192", "type": "image/png", "purpose": "maskable" },
              { "src": "/icons/icon-maskable-512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
            ]
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          replacements={
            '<title>Cita reconocimiento médico</title>':'<title>PROFEA</title>',
            '<meta name="description" content="Cita reconocimiento médico" />':'<meta name="description" content="Sistema de Gestión PROFEA de la Diputación Provincial de Cádiz" />',
            '<meta property="og:title" content="Cita reconocimiento médico" />':'<meta property="og:title" content="PROFEA" />',
            '<meta property="og:description" content="Cita reconocimiento médico" />':'<meta property="og:description" content="Sistema de Gestión PROFEA de la Diputación Provincial de Cádiz" />',
            '<meta property="og:site_name" content="Cita reconocimiento médico" />':'<meta property="og:site_name" content="PROFEA" />',
            '<meta name="twitter:title" content="Cita reconocimiento médico" />':'<meta name="twitter:title" content="PROFEA" />',
            '<meta name="twitter:description" content="Cita reconocimiento médico" />':'<meta name="twitter:description" content="Sistema de Gestión PROFEA de la Diputación Provincial de Cádiz" />',
            '<meta name="application-name" content="Gestión PROFEA" />':'<meta name="application-name" content="PROFEA" />',
            '<meta name="apple-mobile-web-app-title" content="PROFEA Cádiz" />':'<meta name="apple-mobile-web-app-title" content="PROFEA" />',
            '<link rel="apple-touch-icon" href="/favicon.png" />':'<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />',
            '<link rel="icon" type="image/png" href="/favicon.png" />':'<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />\n    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />\n    <link rel="shortcut icon" href="/favicon.ico" />'
          }
          for a,b in replacements.items():
              if a not in s: raise SystemExit(f'metadata marker missing: {a}')
              s=s.replace(a,b,1)
          p.write_text(s)
          PY

      - name: Harden service worker static cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/service-worker.js'); s=p.read_text()
          s=s.replace("const CACHE_NAME = 'profea-static-v2';", "const CACHE_NAME = 'profea-static-v3';")
          start=s.index('const STATIC_ASSETS = [')
          end=s.index('];', start)+2
          block="""const STATIC_ASSETS = [
            '/manifest.webmanifest',
            '/favicon.ico',
            '/icons/favicon-16x16.png',
            '/icons/favicon-32x32.png',
            '/icons/apple-touch-icon.png',
            '/icons/icon-192.png',
            '/icons/icon-512.png',
            '/icons/icon-maskable-192.png',
            '/icons/icon-maskable-512.png',
            '/logo-diputacion-profea.svg',
            '/logo-diputacion-profea-dark.svg'
          ];"""
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY

      - name: Replace installation manager
        run: |
          cat > components/AppInstallPromo.tsx <<'EOF'
          import React, { useEffect, useMemo, useState } from "react";
          import { Download, Share, X } from "lucide-react";

          type DeferredInstallPrompt = Event & {
            prompt: () => Promise<void>;
            userChoice: Promise<{ outcome: "accepted" | "dismissed"; platform: string }>;
          };
          type DeviceKind = "ios" | "android" | "windows" | "mac" | "linux" | "other";
          type BrowserKind = "edge" | "chrome" | "safari" | "firefox" | "other";
          const DISMISS_KEY = "profea_install_promo_v3_dismissed_at";
          const DISMISS_TTL = 7 * 24 * 60 * 60 * 1000;

          const isStandalone = () => typeof window !== "undefined" && (
            window.matchMedia("(display-mode: standalone)").matches || (navigator as any).standalone === true
          );

          const detectEnvironment = () => {
            if (typeof navigator === "undefined") return { device: "other" as DeviceKind, browser: "other" as BrowserKind };
            const ua = navigator.userAgent.toLowerCase();
            const platform = String((navigator as any).userAgentData?.platform || navigator.platform || "").toLowerCase();
            let device: DeviceKind = "other";
            if (/iphone|ipad|ipod/.test(ua) || (platform.includes("mac") && navigator.maxTouchPoints > 1)) device = "ios";
            else if (ua.includes("android")) device = "android";
            else if (ua.includes("windows") || platform.includes("win")) device = "windows";
            else if (ua.includes("macintosh") || platform.includes("mac")) device = "mac";
            else if (ua.includes("linux") || platform.includes("linux")) device = "linux";
            let browser: BrowserKind = "other";
            if (ua.includes("edg/")) browser = "edge";
            else if (ua.includes("firefox")) browser = "firefox";
            else if (ua.includes("chrome") || ua.includes("crios")) browser = "chrome";
            else if (ua.includes("safari")) browser = "safari";
            return { device, browser };
          };

          export function AppInstallPromo() {
            const [installPrompt, setInstallPrompt] = useState<DeferredInstallPrompt | null>(null);
            const [visible, setVisible] = useState(false);
            const [showHelp, setShowHelp] = useState(false);
            const env = useMemo(detectEnvironment, []);

            useEffect(() => {
              if (isStandalone()) return;
              const dismissedAt = Number(localStorage.getItem(DISMISS_KEY) || "0");
              const canAutoShow = !dismissedAt || Date.now() - dismissedAt >= DISMISS_TTL;
              const beforeInstall = (event: Event) => {
                event.preventDefault();
                setInstallPrompt(event as DeferredInstallPrompt);
                if (canAutoShow) window.setTimeout(() => setVisible(true), 350);
              };
              const installed = () => {
                setInstallPrompt(null); setVisible(false); setShowHelp(false);
                localStorage.removeItem(DISMISS_KEY);
                window.dispatchEvent(new CustomEvent('profea:toast', { detail: { message: 'PROFEA se ha instalado correctamente.', type: 'success' } }));
              };
              const openInstall = () => { if (!isStandalone()) { setVisible(true); setShowHelp(false); } };
              window.addEventListener("beforeinstallprompt", beforeInstall);
              window.addEventListener("appinstalled", installed);
              window.addEventListener("profea:open-install", openInstall);
              const fallbackTimer = canAutoShow ? window.setTimeout(() => setVisible(true), 1400) : 0;
              return () => {
                window.removeEventListener("beforeinstallprompt", beforeInstall);
                window.removeEventListener("appinstalled", installed);
                window.removeEventListener("profea:open-install", openInstall);
                if (fallbackTimer) window.clearTimeout(fallbackTimer);
              };
            }, []);

            const dismiss = () => { localStorage.setItem(DISMISS_KEY, String(Date.now())); setVisible(false); };
            const handleInstall = async () => {
              if (installPrompt) {
                try {
                  await installPrompt.prompt();
                  const choice = await installPrompt.userChoice;
                  if (choice.outcome === "accepted") setVisible(false);
                  setInstallPrompt(null);
                } catch { setShowHelp(true); }
              } else setShowHelp(true);
            };
            if (!visible || isStandalone()) return null;

            const help: Record<DeviceKind, string> = {
              ios: "En iPhone/iPad: abre PROFEA en Safari, pulsa Compartir → Añadir a pantalla de inicio → Añadir.",
              android: "En Android: usa Chrome/Edge y pulsa ⋮ → Instalar aplicación o Añadir a pantalla de inicio.",
              windows: "En Windows: usa Edge o Chrome y pulsa Instalar en la barra de direcciones; también puedes usar ⋮ → Aplicaciones → Instalar PROFEA.",
              mac: env.browser === 'safari' ? "En Safari: Archivo → Añadir al Dock. En Chrome/Edge usa el botón Instalar de la barra de direcciones." : "En Mac: usa el botón Instalar de Chrome/Edge. En Safari compatible: Archivo → Añadir al Dock.",
              linux: "En Chrome/Edge/Chromium: usa el icono Instalar de la barra de direcciones o el menú del navegador.",
              other: "Usa la opción Instalar aplicación o Añadir a pantalla de inicio de tu navegador."
            };
            const labels: Record<DeviceKind,string> = { ios:'iPhone/iPad', android:'Android', windows:'Windows', mac:'Mac', linux:'Linux', other:'este dispositivo' };
            return (
              <aside className="profea-install-promo no-print" aria-label="Instalar aplicación PROFEA">
                <div className="profea-install-promo__icon" aria-hidden="true"><img src="/icons/icon-192.png" alt="" /></div>
                <div className="profea-install-promo__copy">
                  <span className="profea-install-promo__title">Instala PROFEA</span>
                  <span className="profea-install-promo__text">{showHelp ? help[env.device] : `Dispositivo detectado: ${labels[env.device]}. Instala PROFEA con el icono oficial de Diputación de Cádiz.`}</span>
                </div>
                <div className="profea-install-promo__actions">
                  <button type="button" className="profea-install-promo__button" onClick={handleInstall}>
                    {env.device === "ios" && !installPrompt ? <Share size={14} className="inline mr-1" /> : <Download size={14} className="inline mr-1" />}
                    {installPrompt ? "Instalar PROFEA" : "Cómo instalar"}
                  </button>
                  <button type="button" className="profea-install-promo__dismiss" onClick={dismiss} aria-label="Ahora no"><X size={16} /></button>
                </div>
              </aside>
            );
          }
          EOF

      - name: Add installation section to Configuración
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/Configuracion.tsx'); s=p.read_text()
          marker='''                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 font-medium">\n                  Respalde toda la base de datos local de trabajadores activos,'''
          card='''                <div className="mt-5 rounded-xl border border-sky-200 dark:border-sky-800 bg-sky-50/70 dark:bg-sky-950/30 p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">\n                  <div>\n                    <p className="text-sm font-bold text-slate-800 dark:text-slate-100">Instalación de PROFEA</p>\n                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Instala PROFEA como aplicación o acceso directo con el icono oficial de Diputación de Cádiz. El sistema detectará tu dispositivo y navegador.</p>\n                  </div>\n                  <button\n                    type="button"\n                    onClick={() => window.dispatchEvent(new CustomEvent('profea:open-install'))}\n                    className="inline-flex items-center justify-center gap-2 rounded-xl border border-sky-200 dark:border-sky-800 bg-white dark:bg-slate-900 px-4 py-2.5 text-sm font-bold text-sky-700 dark:text-sky-300 shadow-sm hover:bg-sky-50 dark:hover:bg-sky-900/30 transition-colors"\n                  >\n                    <Download className="w-4 h-4" />\n                    Instalar PROFEA\n                  </button>\n                </div>\n'''
          if marker not in s: raise SystemExit('Configuracion insertion marker missing')
          s=s.replace(marker, card+marker,1)
          p.write_text(s)
          PY

      - name: Validate PWA files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('public/manifest.webmanifest').read_text())
          assert m['name']=='PROFEA' and m['short_name']=='PROFEA'
          assert m['display']=='standalone' and m['start_url']=='/' and m['scope']=='/'
          for icon in m['icons']:
              assert Path('public'+icon['src']).exists(), icon['src']
          html=Path('index.html').read_text()
          for required in ['/manifest.webmanifest','/icons/apple-touch-icon.png','application-name" content="PROFEA','apple-mobile-web-app-title" content="PROFEA']:
              assert required in html, required
          PY
          npm ci
          npm run lint
          npm run build

      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/icons public/favicon.ico public/manifest.webmanifest public/service-worker.js index.html components/AppInstallPromo.tsx components/Configuracion.tsx
          git commit -m 'feat: make PROFEA installable across desktop and mobile'
          git push
