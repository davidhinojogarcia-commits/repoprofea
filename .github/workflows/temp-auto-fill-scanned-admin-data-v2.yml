name: Temp scanner autofill v2
on:
  push:
    branches:
      - fix/worksite-pdf-text-alignment-20260916
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/worksite-pdf-text-alignment-20260916
          fetch-depth: 0
      - run: |
          sed -i '/if (!window.confirm(`DATOS DETECTADOS/,/`)) return;/d' components/CameraScannerModal.tsx
          grep -q "profea:administrative-data-recognized" components/CameraScannerModal.tsx
          if grep -q "¿Incorporar estos datos al trabajador que estás registrando?" components/CameraScannerModal.tsx; then exit 1; fi
          npm install --no-audit --no-fund
          npm run lint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CameraScannerModal.tsx
          git commit -m "feat: autocompletar datos administrativos desde escáner"
          git push origin HEAD:fix/worksite-pdf-text-alignment-20260916
