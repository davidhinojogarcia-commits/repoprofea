name: Apply Firestore source migration

on:
  push:
    branches: ['feat/firebase-multiusuario']
  pull_request:
    branches: ['main']

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip firestore migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/firebase-multiusuario
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply migration
        run: python scripts/migrate_firestore_source.py
      - name: Repair migration output
        run: python scripts/repair_firestore_migration.py
      - name: Finalize Firestore business persistence
        run: python scripts/finalize_firestore_migration.py
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json App.tsx src/lib/firebase.ts components/SubcontratasSection.tsx components/GestionCitas.tsx scripts/repair_firestore_migration.py scripts/finalize_firestore_migration.py .github/workflows/apply-firestore-migration.yml
          git commit -m 'refactor: use Firestore as permanent data source [skip firestore migration]'
          git push origin feat/firebase-multiusuario
