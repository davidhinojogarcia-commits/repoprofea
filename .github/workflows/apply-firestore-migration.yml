name: Finalize Firebase multiuser migration

on:
  push:
    branches: ['feat/firebase-multiusuario']
  pull_request:
    branches: ['main']

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip firestore migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/firebase-multiusuario
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize application
        run: python scripts/finalize_multiusuario.py
      - name: Validate no manual synchronization remains
        run: |
          if grep -RniE 'FirebaseSyncModal|DatabaseSyncAlert|triggerFirestoreDatabaseSync|/api/database/save-workers-batch|/api/database/delete-worker' App.tsx components src --exclude='*.map'; then
            echo 'Legacy/manual synchronization code detected.'
            exit 1
          fi
      - name: Commit finalization
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.tsx components/Header.tsx src/lib/firebase.ts scripts/finalize_multiusuario.py .github/workflows/apply-firestore-migration.yml
          git commit -m 'refactor: finalize Firebase multiuser migration [skip firestore migration]'
          git push origin feat/firebase-multiusuario
