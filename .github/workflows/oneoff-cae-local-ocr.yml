name: One-off CAE local OCR fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-cae-local-ocr.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install tesseract.js@6.0.1 --save
      - run: python scripts/apply_cae_local_ocr.py
      - run: npm run lint
      - run: npm run build
      - run: |
          grep -n "extractClientDocumentText" components/FileUploaderIA.tsx
          grep -n "extractedText" api/analyze-subcontractor-docs.ts
          grep -n "strongDeterministicEvidence" api/analyze-subcontractor-docs.ts
      - run: git rm -f .github/workflows/oneoff-cae-local-ocr.yml scripts/apply_cae_local_ocr.py
      - run: |
          git config user.name "davidhinojogarcia-commits"
          git config user.email "davidhinojogarcia@gmail.com"
          git add package.json package-lock.json components/FileUploaderIA.tsx api/analyze-subcontractor-docs.ts src/lib/clientDocumentText.ts
          git commit -m "fix: add local PDF OCR fallback for CAE"
          git push origin main
