name: Temporary run worker admin data patch

on:
  push:
    branches:
      - work/resumen-renombres-pendientes
    paths:
      - '.github/workflows/tmp-run-worker-admin-data.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_worker_admin_data.py
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add types.ts src/lib/personalDataValidators.ts src/services/databaseService.ts components/RegistrationForm.tsx components/EditPersonModal.tsx components/CameraScannerModal.tsx supabase/migrations/20260915170500_add_worker_nuss_iban.sql
          git commit -m 'feat: add validated NSS and IBAN with scanner OCR'
          git push
