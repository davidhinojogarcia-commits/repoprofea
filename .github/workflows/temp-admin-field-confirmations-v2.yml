name: Temp admin field confirmations v2

on:
  push:
    branches:
      - fix/worksite-pdf-text-alignment-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/worksite-pdf-text-alignment-20260916
          fetch-depth: 0
      - name: Patch scanner
        run: python3 .github/scripts/patch_admin_field_confirmations.py
      - name: Verify and lint
        run: |
          grep -q "DNI/NIE detectado" components/CameraScannerModal.tsx
          grep -q "Nº de Seguridad Social detectado" components/CameraScannerModal.tsx
          grep -q "IBAN / Cuenta bancaria detectado" components/CameraScannerModal.tsx
          grep -q "acceptedCount" components/CameraScannerModal.tsx
          npm install --no-audit --no-fund
          npm run lint
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CameraScannerModal.tsx
          git commit -m "feat: confirmar individualmente datos administrativos escaneados"
          git push origin HEAD:fix/worksite-pdf-text-alignment-20260916
