name: Repair Subcontratas build

on:
  push:
    branches: ['feat/firebase-multiusuario']

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip subcontratas repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/firebase-multiusuario
          fetch-depth: 0
      - name: Restore and repair SubcontratasSection
        run: |
          git checkout 1ce8f23d0467fbfdd1efbef6482c49d368656b00 -- components/SubcontratasSection.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path('components/SubcontratasSection.tsx')
          text = p.read_text()
          text = text.replace("import React, { useState, useEffect, useMemo, useRef } from 'react';", "import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';", 1)
          text = text.replace("\n, [subcontratistas]);\n", "\n", 1)
          p.write_text(text)
          PY
      - name: Verify syntax
        run: |
          npm install --package-lock-only --ignore-scripts
          npm install --ignore-scripts
          npx vite build
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/SubcontratasSection.tsx
          git commit -m 'fix: repair SubcontratasSection build [skip subcontratas repair]'
          git push origin feat/firebase-multiusuario
