name: Temporary implement inventory core

on:
  push:
    branches: [work/resumen-renombres-pendientes]
    paths:
      - '.github/workflows/tmp-implement-inventory-core.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write component and migration
        shell: bash
        env:
          COMPONENT_B64: 
          MIGRATION_B64: 
        run: |
          mkdir -p components supabase/migrations
          printf '%s' "$COMPONENT_B64" | base64 -d | gzip -d > components/InventorySection.tsx
          printf '%s' "$MIGRATION_B64" | base64 -d | gzip -d > supabase/migrations/20260915153000_shared_inventory_zone6.sql

      - name: Wire navigation and app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/Sidebar.tsx')
          s=p.read_text()
          s=s.replace("import { LayoutDashboard, UserPlus, Users, Menu, ChevronLeft, Settings, Trash2, Camera, Calendar, CalendarDays, HardHat, BriefcaseBusiness, ShieldCheck, LogOut, Loader2, Files } from 'lucide-react';", "import { LayoutDashboard, UserPlus, Users, Menu, ChevronLeft, Settings, Trash2, Camera, Calendar, CalendarDays, HardHat, BriefcaseBusiness, ShieldCheck, LogOut, Loader2, Files, Wrench } from 'lucide-react';")
          s=s.replace("export type ViewMode = 'dashboard' | 'calendario' | 'registro' | 'sae' | 'directorio' | 'estadisticas' | 'configuracion' | 'papelera' | 'citas' | 'subcontratas' | 'documentacion_obra' | 'administracion';", "export type ViewMode = 'dashboard' | 'calendario' | 'registro' | 'sae' | 'directorio' | 'estadisticas' | 'configuracion' | 'papelera' | 'citas' | 'subcontratas' | 'documentacion_obra' | 'inventario' | 'administracion';")
          anchor="""    {
      label: 'Sistema',
      items: [
"""
          insert="""    {
      label: 'Logística',
      items: [
        { id: 'inventario', label: 'Herramientas y maquinaria', icon: Wrench },
      ],
    },
    {
      label: 'Sistema',
      items: [
"""
          if anchor not in s: raise SystemExit('Sidebar anchor missing')
          s=s.replace(anchor,insert,1)
          p.write_text(s)

          p=Path('App.tsx')
          s=p.read_text()
          lazy="const SaeSection = lazy(() => import('./components/SaeSection').then(module => ({ default: module.SaeSection })));\n"
          if "./components/InventorySection" not in s:
              s=s.replace(lazy,lazy+"const InventorySection = lazy(() => import('./components/InventorySection').then(module => ({ default: module.InventorySection })));\n",1)
          state="  const [activeView, setActiveView] = useState<ViewMode>('dashboard');\n"
          if "inventoryItem" not in s:
              s=s.replace(state,state+"  useEffect(() => {\n    if (new URLSearchParams(window.location.search).has('inventoryItem')) setActiveView('inventario');\n  }, []);\n",1)
          config="""          {activeView === 'configuracion' && (
            <Suspense fallback={<ViewLoadingFallback />}>
"""
          block="""          {activeView === 'inventario' && (
            <Suspense fallback={<ViewLoadingFallback />}>
              <InventorySection savedObras={savedObras} />
            </Suspense>
          )}

"""
          if "activeView === 'inventario'" not in s:
              if config not in s: raise SystemExit('App config anchor missing')
              s=s.replace(config,block+config,1)
          p.write_text(s)
          PY

      - name: Typecheck and build
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/InventorySection.tsx components/Sidebar.tsx App.tsx supabase/migrations/20260915153000_shared_inventory_zone6.sql src/services/inventoryService.ts src/data/inventoryZona6Seed.ts
          git commit -m 'feat: add shared tools and machinery inventory with traceability' || exit 0
          git push
