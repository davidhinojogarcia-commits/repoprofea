name: Temp direct Supabase CRUD cleanup

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-direct-supabase-crud.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_direct_supabase_crud.py
      - name: Verify legacy business persistence removed
        run: |
          ! grep -n "Auto-sync catalogs and settings to user workspace in Firestore\|Real-time listener for local subcontratas\|personasEliminadasPROFEA\|localStorage.setItem('personasPROFEA'" App.tsx
          ! grep -n "deleteWorkerFromWorkspace\|syncDeletedWorkerToWorkspace\|deleteFromWorkspaceTrash\|deleteWorkerFromCloud\|syncDeletedWorkerToCloud\|deleteFromCloudTrash" App.tsx
          grep -n "subscribeToDocuments<DeletedPerson>('trash'\|createDocument('trash'\|deleteDocument('workers'" App.tsx
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit cleanup and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_direct_supabase_crud.py .github/workflows/temp-direct-supabase-crud.yml
          git add -A
          git commit -m 'refactor: move worker trash CRUD directly to Supabase'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
