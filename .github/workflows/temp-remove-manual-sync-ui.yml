name: Temp remove manual sync UI

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-remove-manual-sync-ui.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_remove_manual_sync_ui.py
      - name: Verify manual sync UI is gone
        run: |
          ! grep -n "Sincronizar Cola Ahora\|Cola de Sincronización\|Pendiente de subir a Firebase" App.tsx
          ! grep -n "pendingSyncCount\|isOffline" components/Header.tsx
          ! grep -n "isSyncActive\|onToggleSync" components/PersonList.tsx
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit migrated code and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_remove_manual_sync_ui.py .github/workflows/temp-remove-manual-sync-ui.yml
          git add -A
          git commit -m 'refactor: remove manual synchronization UI'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
