name: Temp migrate PDF preferences

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-migrate-pdf-preferences.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_migrate_pdf_preferences.py
      - name: Verify PDF config uses Supabase
        run: |
          grep -n "hydrateStoredPdfConfig" src/lib/exportUtils.ts components/AuthGate.tsx
          ! grep -n "localStorage.setItem('pdfCustomConfig'" src/lib/exportUtils.ts
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit migration and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_migrate_pdf_preferences.py .github/workflows/temp-migrate-pdf-preferences.yml
          git add -A
          git commit -m 'feat: store PDF preferences in Supabase'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
