name: Temporary move import and compact exports

on:
  push:
    branches: [work/resumen-renombres-pendientes]
    paths:
      - '.github/workflows/tmp-move-import-and-compact-exports.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending UI changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Directory: remove worker-import buttons and compact export labels/sizes.
          p = Path('components/PersonListView.tsx')
          s = p.read_text()

          # Remove the prominent import button near the directory actions.
          s = re.sub(
              r'''\n\s*<button\s+\n\s*onClick=\{handleImportClick\}\s+\n\s*className="flex items-center justify-center bg-gradient-to-r from-blue-600 to-indigo-600[^\n]*"\s*\n\s*>\s*\n\s*<Upload className="w-5 h-5 mr-2" /> Importación de trabajadores\s*\n\s*</button>''',
              '',
              s,
              count=1,
          )

          # Remove the compact toolbar import button shown next to PDF/Excel exports.
          toolbar_import = '''               <button onClick={handleImportClick} className="directorio-import-button flex-1 md:flex-none flex items-center justify-center bg-blue-50 hover:bg-blue-100 dark:bg-blue-950/40 dark:hover:bg-blue-900/50 text-blue-600 dark:text-blue-300 px-4 py-2 rounded-lg transition-colors text-sm font-semibold shadow-sm border border-blue-200 dark:border-blue-800/80 cursor-pointer">\n                  <Upload className="w-4 h-4 mr-2" /> Importación de trabajadores\n               </button>\n'''
          s = s.replace(toolbar_import, '', 1)

          replacements = {
              '''<FileText className="w-3 h-3 mr-1.5" /> PDF Reconocimientos{isSelectionActive ? ` (${peopleToExport.length})` : ''}''': '''<FileText className="w-3 h-3 mr-1.5" /> PDF''',
              '''<Download className="w-3 h-3 mr-1.5" /> Excel Reconocimientos{isSelectionActive ? ` (${peopleToExport.length})` : ''}''': '''<Download className="w-3 h-3 mr-1.5" /> Excel''',
              '''<FileText className="w-3 h-3 mr-1.5" /> Calzado PDF{isSelectionActive ? ` (${peopleToExport.length})` : ''}''': '''<FileText className="w-3 h-3 mr-1.5" /> PDF''',
              '''<Download className="w-3 h-3 mr-1.5" /> Calzado Excel{isSelectionActive ? ` (${peopleToExport.length})` : ''}''': '''<Download className="w-3 h-3 mr-1.5" /> Excel''',
              '''<FileText className="w-3 h-3 mr-1.5" /> PRL PDF{isSelectionActive ? ` (${peopleToExport.length})` : ''}''': '''<FileText className="w-3 h-3 mr-1.5" /> PDF''',
              '''<Download className="w-3 h-3 mr-1.5" /> PRL Excel{isSelectionActive ? ` (${peopleToExport.length})` : ''}''': '''<Download className="w-3 h-3 mr-1.5" /> Excel''',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Keep the existing visual design, but make all export-format buttons the same width.
          callbacks = [
              'onExportPDF', 'onExport', 'onExportRRMMPDF', 'onExportRRMMExcel',
              'onExportCalzadoPDF', 'onExportCalzadoExcel', 'onExportPRLPDF', 'onExportPRLExcel'
          ]
          for cb in callbacks:
              pattern = rf'(<button onClick=\{{\(\) => {cb}\(peopleToExport\)\}} className=)([^>]+)(>)'
              def fix(m):
                  text = m.group(2)
                  text = text.replace('flex-1 md:flex-none', 'w-[112px] flex-none')
                  return m.group(1) + text + m.group(3)
              s = re.sub(pattern, fix, s)

          p.write_text(s)

          # 2) Configuration > Backup: add worker import there.
          p = Path('components/Configuracion.tsx')
          s = p.read_text()

          s = s.replace(
              '  setToast?: React.Dispatch<\n    React.SetStateAction<{ message: string; type: "success" | "error" } | null>\n  >;\n}',
              '  setToast?: React.Dispatch<\n    React.SetStateAction<{ message: string; type: "success" | "error" } | null>\n  >;\n  onImportWorkers?: (file: File) => void;\n}',
              1,
          )
          s = s.replace(
              '  setAutoThemeByTime,\n  setToast,\n}) => {',
              '  setAutoThemeByTime,\n  setToast,\n  onImportWorkers,\n}) => {',
              1,
          )
          s = s.replace(
              '  const [loadedBackup, setLoadedBackup] = useState<any | null>(null);\n  const fileInputRef = useRef<HTMLInputElement>(null);',
              '  const [loadedBackup, setLoadedBackup] = useState<any | null>(null);\n  const fileInputRef = useRef<HTMLInputElement>(null);\n  const workerImportInputRef = useRef<HTMLInputElement>(null);',
              1,
          )

          anchor = '''                  Copia de Seguridad Completa\n                </h2>'''
          insert = '''                  Copia de Seguridad Completa\n                </h2>\n                {onImportWorkers && (\n                  <div className="mt-5 rounded-xl border border-blue-200 dark:border-blue-800 bg-blue-50/70 dark:bg-blue-950/30 p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">\n                    <div>\n                      <p className="text-sm font-bold text-slate-800 dark:text-slate-100">Importación de trabajadores</p>\n                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Importa un listado de trabajadores desde Excel, CSV, JSON o PDF.</p>\n                    </div>\n                    <input\n                      ref={workerImportInputRef}\n                      type="file"\n                      className="hidden"\n                      accept=".xlsx,.xls,.csv,.json,.pdf"\n                      onChange={(e) => {\n                        const file = e.target.files?.[0];\n                        if (file) onImportWorkers(file);\n                        e.target.value = \"\";\n                      }}\n                    />\n                    <button\n                      type="button"\n                      onClick={() => workerImportInputRef.current?.click()}\n                      className="inline-flex items-center justify-center gap-2 rounded-xl border border-blue-200 dark:border-blue-800 bg-white dark:bg-slate-900 px-4 py-2.5 text-sm font-bold text-blue-700 dark:text-blue-300 shadow-sm hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-colors"\n                    >\n                      <Upload className="w-4 h-4" />\n                      Importación de trabajadores\n                    </button>\n                  </div>\n                )}'''
          if anchor not in s:
              raise SystemExit('Backup heading anchor not found')
          s = s.replace(anchor, insert, 1)
          p.write_text(s)

          # 3) Wire the existing worker-import handler into Configuración.
          p = Path('App.tsx')
          s = p.read_text()
          anchor = '''            <Configuracion \n              savedObras={savedObras}'''
          replacement = '''            <Configuracion \n              onImportWorkers={handleImportExcel}\n              savedObras={savedObras}'''
          if anchor not in s:
              raise SystemExit('Configuracion invocation anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)
          PY

      - name: Verify requested UI text
        run: |
          grep -q 'onImportWorkers={handleImportExcel}' App.tsx
          grep -q 'Importación de trabajadores' components/Configuracion.tsx
          ! grep -q '> PDF Reconocimientos' components/PersonListView.tsx
          ! grep -q '> Excel Reconocimientos' components/PersonListView.tsx
          ! grep -q '> Calzado PDF' components/PersonListView.tsx
          ! grep -q '> Calzado Excel' components/PersonListView.tsx

      - name: Commit pending changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.tsx components/Configuracion.tsx components/PersonListView.tsx
          git commit -m 'ui: move worker import to backup settings and compact export labels'
          git push
