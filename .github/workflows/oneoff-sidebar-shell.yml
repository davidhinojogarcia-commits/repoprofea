name: One-off sidebar shell integration

on:
  push:
    branches: [refactor-ui-foundation]
    paths:
      - '.github/workflows/oneoff-sidebar-shell.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refactor-ui-foundation
      - run: python scripts/connect_sidebar_shell.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: git rm -f .github/workflows/oneoff-sidebar-shell.yml scripts/connect_sidebar_shell.py
      - run: |
          git config user.name "davidhinojogarcia-commits"
          git config user.email "davidhinojogarcia@gmail.com"
          git add components/Sidebar.tsx
          git commit -m "style: connect sidebar shell to shared design system"
          git push origin refactor-ui-foundation
