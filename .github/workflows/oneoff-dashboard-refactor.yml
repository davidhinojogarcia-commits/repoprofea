name: One-off dashboard summary refactor

on:
  push:
    branches: [refactor-ui-foundation]
    paths:
      - '.github/workflows/oneoff-dashboard-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refactor-ui-foundation
      - run: python scripts/refactor_dashboard_summary.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: git rm -f .github/workflows/oneoff-dashboard-refactor.yml scripts/refactor_dashboard_summary.py summary-layout.css
      - run: |
          git config user.name "davidhinojogarcia-commits"
          git config user.email "davidhinojogarcia@gmail.com"
          git add App.tsx index.tsx
          git commit -m "refactor: make Resumen a real lightweight dashboard"
          git push origin refactor-ui-foundation
