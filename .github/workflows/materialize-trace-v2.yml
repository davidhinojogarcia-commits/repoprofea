name: Materialize GestionProfea 1.19.0

on:
  push:
    branches:
      - 'validation/gestionprofea-trace-v1-19-0-20261003'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 'validation/gestionprofea-trace-v1-19-0-20261003'

      - name: Reconstruct validated package
        shell: bash
        run: |
          set -euo pipefail
          cat .validation/pkg.part*.txt | tr -d '\n\r ' | base64 -d > /tmp/trace-v2.zip
          echo "706a9e689402d9a5dbb3c8bd53f9364948d0a04680e85690d07ab2d62da74fc9  /tmp/trace-v2.zip" | sha256sum -c -
          rm -rf /tmp/trace-v2
          mkdir -p /tmp/trace-v2
          unzip -q /tmp/trace-v2.zip -d /tmp/trace-v2
          PKG_DIR="$(find /tmp/trace-v2 -mindepth 1 -maxdepth 1 -type d | head -n1)"
          echo "PKG_DIR=$PKG_DIR" >> "$GITHUB_ENV"

      - name: Materialize validated V2 source
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="a5b3c6be5f397494f5a3100cf508740658dd64c2"
          for file in             src/services/foremanPortalService.ts             components/ForemanMobilePortal.tsx             components/ForemanDocumentsDashboard.tsx             src/lib/mandatoryEmailIntake.ts             package.json             src/lib/appVersion.ts             .github/workflows/ci.yml             package-lock.json
          do
            git show "$BASE_SHA:$file" > "$file"
          done
          node "$PKG_DIR/apply-v2.mjs" "$GITHUB_WORKSPACE"
          git diff --check
          grep -q "APP_VERSION = '1.19.0'" src/lib/appVersion.ts
          test -s supabase/migrations/20261003090000_mandatory_traceability_v2.sql

      - name: Remove validation-only artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .validation
          rm -f .github/workflows/trace-v2-validation.yml
          rm -f .github/workflows/validate-trace-v2.yml
          rm -f .github/workflows/materialize-trace-v2.yml
          git diff --check

      - name: Commit validated release to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: GestionProfea 1.19.0 · trazabilidad documental V2"
          git push origin HEAD:validation/gestionprofea-trace-v1-19-0-20261003
