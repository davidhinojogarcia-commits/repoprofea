name: Fix Firmas CAE placement
on:
  push:
    branches: [cae-firmas-final]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cae-firmas-final
      - name: Move signatures card below header
        shell: python
        run: |
          from pathlib import Path
          p=Path('components/SubcontratasSection.tsx')
          s=p.read_text(encoding='utf-8')
          block='''        <div className="mb-5">\n          <FirmasReporteTecnico onToast={onToast} />\n        </div>\n\n'''
          if s.count(block)!=1:
              raise SystemExit(f'Expected one signatures block, found {s.count(block)}')
          s=s.replace(block,'',1)
          marker='''      </div>\n\n      {/* Visual Progress Bar Section for Each Obra */}'''
          replacement='''      </div>\n\n      {/* Firmas del Reporte Técnico: configuración específica del módulo CAE */}\n      <div className="mb-2">\n        <FirmasReporteTecnico onToast={onToast} />\n      </div>\n\n      {/* Visual Progress Bar Section for Each Obra */}'''
          if marker not in s:
              raise SystemExit('Header closing marker not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/SubcontratasSection.tsx
          git commit -m "fix: place technical report signatures in CAE"
          git push origin cae-firmas-final
