name: Patch GestionProfea targeted fixes

on:
  push:
    paths:
      - '.github/workflows/patch-sae-recognition-config.yml'
      - '.github/scripts/patch_sae_recognition.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted fixes
        run: python3 .github/scripts/patch_sae_recognition.py
      - name: Verify build
        run: npm ci && npm run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ReconocimientosMedicosSection.tsx components/MedicalAppointmentConfirmationPortal.tsx src/lib/shareMedicalAppointment.ts src/lib/medicalAppointmentConfirmation.ts api/confirm-medical-appointment.ts index.tsx .env.example
          git diff --cached --quiet && exit 0
          git commit -m "feat: automate medical appointment confirmations"
          git push origin main
