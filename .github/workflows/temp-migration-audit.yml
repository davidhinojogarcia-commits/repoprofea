name: Temp migration audit

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-migration-audit.yml'

permissions:
  contents: write

concurrency:
  group: temp-finalize-supabase
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/temp_finalize_migration.py
      - name: Verify runtime legacy references removed
        run: |
          ! grep -RInE "src/lib/firebase|services/firestoreService|from ['\"]firebase(/|['\"])" App.tsx components src server api --include='*.ts' --include='*.tsx' 2>/dev/null
          ! grep -RInE "createFirestoreWorker|updateFirestoreWorker|deleteFirestoreWorker|fetchFirestoreWorkers|subscribeToFirestoreWorkers" App.tsx components src --include='*.ts' --include='*.tsx' 2>/dev/null
          ! grep -RInE "['\"]workers['\"]" App.tsx components src server api --include='*.ts' --include='*.tsx' 2>/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_finalize_migration.py .github/workflows/temp-migration-audit.yml
          git add -A
          git commit -m 'refactor: finish direct Supabase worker persistence'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
