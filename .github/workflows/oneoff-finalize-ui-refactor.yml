name: One-off finalize UI refactor

on:
  push:
    branches: [refactor-ui-foundation]
    paths:
      - '.github/workflows/oneoff-finalize-ui-refactor.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refactor-ui-foundation
      - run: python scripts/finalize_ui_refactor.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: git rm -f .github/workflows/oneoff-finalize-ui-refactor.yml scripts/finalize_ui_refactor.py
      - run: |
          git config user.name "davidhinojogarcia-commits"
          git config user.email "davidhinojogarcia@gmail.com"
          git add App.tsx api/analyze-subcontractor-docs.ts components/FileUploaderIA.tsx components/ChecklistReviewModal.tsx
          git commit -m "refactor: finalize institutional UI CAE review and route performance"
          git push origin refactor-ui-foundation
