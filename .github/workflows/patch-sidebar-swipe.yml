name: Patch sidebar swipe gestures

on:
  push:
    paths:
      - '.github/workflows/patch-sidebar-swipe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add touch swipe gestures to sidebar
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('components/Sidebar.tsx')
          text = path.read_text()

          text = text.replace("import React from 'react';", "import React, { useRef } from 'react';")

          anchor = "  const { user, role, signOut, signingOut } = useAuthShell();\n"
          insert = """  const touchStartX = useRef<number | null>(null);\n  const touchStartY = useRef<number | null>(null);\n  const SWIPE_THRESHOLD = 56;\n\n  const beginSwipe = (event: React.TouchEvent) => {\n    const touch = event.touches[0];\n    touchStartX.current = touch?.clientX ?? null;\n    touchStartY.current = touch?.clientY ?? null;\n  };\n\n  const finishSwipe = (event: React.TouchEvent, source: 'edge' | 'sidebar') => {\n    if (touchStartX.current === null || touchStartY.current === null) return;\n    const touch = event.changedTouches[0];\n    if (!touch) return;\n\n    const deltaX = touch.clientX - touchStartX.current;\n    const deltaY = touch.clientY - touchStartY.current;\n    touchStartX.current = null;\n    touchStartY.current = null;\n\n    if (Math.abs(deltaX) < SWIPE_THRESHOLD || Math.abs(deltaX) <= Math.abs(deltaY) * 1.15) return;\n\n    const desktopLike = window.innerWidth >= 1024;\n    if (deltaX > 0) {\n      if (desktopLike) setIsCollapsed(false);\n      else setIsMobileOpen(true);\n      return;\n    }\n\n    if (source === 'sidebar') {\n      if (desktopLike) setIsCollapsed(true);\n      else setIsMobileOpen(false);\n    }\n  };\n\n"""
          if insert.strip() not in text:
              text = text.replace(anchor, anchor + insert)

          fragment = """    <>\n      {isMobileOpen && (\n"""
          replacement = """    <>\n      {!isMobileOpen && (\n        <div\n          className=\"fixed inset-y-0 left-0 z-30 w-5 lg:hidden touch-pan-y\"\n          aria-hidden=\"true\"\n          onTouchStart={beginSwipe}\n          onTouchEnd={(event) => finishSwipe(event, 'edge')}\n        />\n      )}\n\n      {isMobileOpen && (\n"""
          text = text.replace(fragment, replacement)

          aside_end = """        `}\n      >\n"""
          aside_replacement = """        `}\n        onTouchStart={beginSwipe}\n        onTouchEnd={(event) => finishSwipe(event, 'sidebar')}\n        style={{ touchAction: 'pan-y' }}\n      >\n"""
          text = text.replace(aside_end, aside_replacement, 1)

          path.write_text(text)
          PY

      - name: Validate TypeScript
        run: |
          npm install --no-audit --no-fund
          npm run lint

      - name: Build application
        run: npm run build

      - name: Commit swipe gesture support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Sidebar.tsx
          if git diff --cached --quiet; then
            echo "No sidebar changes to commit"
            exit 0
          fi
          git commit -m "Add touch swipe gestures to sidebar"
          git push origin HEAD:main

