name: Temp Supabase App cleanup

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-supabase-app-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_supabase_app_cleanup.py
      - name: Verify legacy worker source removed
        run: |
          ! grep -n "Firestore is the permanent source of truth\|Error leyendo trabajadores de Firestore\|Error al leer los trabajadores desde Firebase\|setIsOffline" App.tsx
          grep -n "Supabase es la única fuente de verdad de trabajadores\|subscribeToDocuments<Person>('workers'" App.tsx
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit cleanup and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_supabase_app_cleanup.py .github/workflows/temp-supabase-app-cleanup.yml
          git add -A
          git commit -m 'refactor: read workers directly from Supabase'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
