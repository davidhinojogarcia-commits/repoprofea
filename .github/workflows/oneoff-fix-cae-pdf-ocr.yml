name: One-off fix CAE PDF OCR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-fix-cae-pdf-ocr.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
      - run: python scripts/fix_cae_pdf_ocr.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: |
          grep -n "extractPdfNativeText" api/analyze-subcontractor-docs.ts
          grep -n "claude-sonnet-5" api/analyze-subcontractor-docs.ts
          grep -n "engineVersion: '2.1.0'" api/analyze-subcontractor-docs.ts
      - run: git rm -f .github/workflows/oneoff-fix-cae-pdf-ocr.yml scripts/fix_cae_pdf_ocr.py
      - run: |
          git config user.name "davidhinojogarcia-commits"
          git config user.email "davidhinojogarcia@gmail.com"
          git add api/analyze-subcontractor-docs.ts
          git commit -m "fix: read native PDF text and harden CAE OCR"
          git push origin main
