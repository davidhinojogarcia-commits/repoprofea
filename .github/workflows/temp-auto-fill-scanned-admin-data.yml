name: Temp auto fill scanned admin data

on:
  push:
    branches:
      - fix/worksite-pdf-text-alignment-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/worksite-pdf-text-alignment-20260916
          fetch-depth: 0
      - name: Patch scanner autocompletion
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("components/CameraScannerModal.tsx")
          text = p.read_text()
          start = text.find("      if (!window.confirm(`DATOS DETECTADOS")
          if start < 0:
              raise SystemExit("confirmation start not found")
          end_marker = "`)) return;\n\n"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("confirmation end not found")
          text = text[:start] + text[end + len(end_marker):]
          p.write_text(text)
          PY
      - name: Verify and lint
        shell: bash
        run: |
          grep -q "profea:administrative-data-recognized" components/CameraScannerModal.tsx
          if grep -q "¿Incorporar estos datos al trabajador que estás registrando?" components/CameraScannerModal.tsx; then exit 1; fi
          grep -q "detail.nuss" components/RegistrationForm.tsx
          grep -q "detail.iban" components/RegistrationForm.tsx
          npm install --no-audit --no-fund
          npm run lint
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CameraScannerModal.tsx
          git commit -m "feat: autocompletar NUSS e IBAN desde documentos escaneados"
          git push origin HEAD:fix/worksite-pdf-text-alignment-20260916
