name: Temp remove bootstrap bridge

on:
  push:
    branches: ['feat/firebase-multiusuario']
    paths:
      - '.github/workflows/temp-remove-bootstrap-bridge.yml'

permissions:
  contents: write

concurrency:
  group: temp-remove-bootstrap-bridge
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/temp_remove_bootstrap_bridge.py
      - name: Verify removed globals
        run: |
          ! grep -RInE "executeDatabaseSync|handleSyncPendingToCloud|handleGoogleLogin|handleGoogleLogout|currentEffectiveWorkspaceId|\bgroupId\b|\bsyncMode\b|\bisOffline\b|\bisSyncing\b|setIsOffline" App.tsx components src index.tsx --include='*.ts' --include='*.tsx' 2>/dev/null
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/temp_remove_bootstrap_bridge.py .github/workflows/temp-remove-bootstrap-bridge.yml
          git add -A
          git commit -m 'refactor: remove temporary bootstrap sync bridge'
          git pull --rebase origin feat/firebase-multiusuario
          git push origin HEAD:feat/firebase-multiusuario
