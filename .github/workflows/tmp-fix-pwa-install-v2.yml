name: Temporary PROFEA PWA install fix v2
on:
  push:
    branches: [work/resumen-renombres-pendientes]
    paths: ['.github/workflows/tmp-fix-pwa-install-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate icons from corporate SVG
        run: |
          python -m pip install --quiet pillow cairosvg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import cairosvg, io
          svg=Path('public/logo-diputacion-profea.svg').read_bytes()
          raw=cairosvg.svg2png(bytestring=svg, output_width=1200)
          logo=Image.open(io.BytesIO(raw)).convert('RGBA')
          out=Path('public/icons'); out.mkdir(parents=True,exist_ok=True)
          def make(size, margin, name):
              bg=Image.new('RGBA',(size,size),(255,255,255,255))
              avail=size-2*int(size*margin)
              scale=min(avail/logo.width,avail/logo.height)
              w=max(1,int(logo.width*scale)); h=max(1,int(logo.height*scale))
              im=logo.resize((w,h),Image.Resampling.LANCZOS)
              bg.alpha_composite(im,((size-w)//2,(size-h)//2))
              bg.convert('RGB').save(out/name,'PNG',optimize=True)
          for n in (72,96,128,144,152,180,192,384,512): make(n,.10,f'icon-{n}.png')
          for n in (192,512): make(n,.20,f'icon-maskable-{n}.png')
          make(180,.10,'apple-touch-icon.png'); make(32,.06,'favicon-32x32.png'); make(16,.04,'favicon-16x16.png')
          Image.open(out/'favicon-32x32.png').save('public/favicon.ico',format='ICO',sizes=[(16,16),(32,32)])
          PY
      - name: Patch PWA metadata and UI
        run: |
          cat > public/manifest.webmanifest <<'EOF'
          {"id":"/","name":"PROFEA","short_name":"PROFEA","description":"Sistema de Gestión PROFEA de la Diputación Provincial de Cádiz","lang":"es","start_url":"/","scope":"/","display":"standalone","display_override":["window-controls-overlay","standalone"],"background_color":"#ffffff","theme_color":"#00548E","orientation":"any","categories":["business","productivity"],"icons":[{"src":"/icons/icon-192.png","sizes":"192x192","type":"image/png","purpose":"any"},{"src":"/icons/icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"},{"src":"/icons/icon-maskable-192.png","sizes":"192x192","type":"image/png","purpose":"maskable"},{"src":"/icons/icon-maskable-512.png","sizes":"512x512","type":"image/png","purpose":"maskable"}]}
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          reps=[('<title>Cita reconocimiento médico</title>','<title>PROFEA</title>'),('<meta name="description" content="Cita reconocimiento médico" />','<meta name="description" content="Sistema de Gestión PROFEA de la Diputación Provincial de Cádiz" />'),('<meta property="og:title" content="Cita reconocimiento médico" />','<meta property="og:title" content="PROFEA" />'),('<meta property="og:description" content="Cita reconocimiento médico" />','<meta property="og:description" content="Sistema de Gestión PROFEA de la Diputación Provincial de Cádiz" />'),('<meta property="og:site_name" content="Cita reconocimiento médico" />','<meta property="og:site_name" content="PROFEA" />'),('<meta name="twitter:title" content="Cita reconocimiento médico" />','<meta name="twitter:title" content="PROFEA" />'),('<meta name="twitter:description" content="Cita reconocimiento médico" />','<meta name="twitter:description" content="Sistema de Gestión PROFEA de la Diputación Provincial de Cádiz" />'),('<meta name="application-name" content="Gestión PROFEA" />','<meta name="application-name" content="PROFEA" />'),('<meta name="apple-mobile-web-app-title" content="PROFEA Cádiz" />','<meta name="apple-mobile-web-app-title" content="PROFEA" />'),('<link rel="apple-touch-icon" href="/favicon.png" />','<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />'),('<link rel="icon" type="image/png" href="/favicon.png" />','<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />\n    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />\n    <link rel="shortcut icon" href="/favicon.ico" />')]
          for a,b in reps:
              if a in s: s=s.replace(a,b,1)
          p.write_text(s)
          sw=Path('public/service-worker.js'); x=sw.read_text().replace("profea-static-v2","profea-static-v3")
          a=x.index('const STATIC_ASSETS = ['); b=x.index('];',a)+2
          block="const STATIC_ASSETS = ['/manifest.webmanifest','/favicon.ico','/icons/favicon-16x16.png','/icons/favicon-32x32.png','/icons/apple-touch-icon.png','/icons/icon-192.png','/icons/icon-512.png','/icons/icon-maskable-192.png','/icons/icon-maskable-512.png','/logo-diputacion-profea.svg','/logo-diputacion-profea-dark.svg'];"
          sw.write_text(x[:a]+block+x[b:])
          PY
          cat > components/AppInstallPromo.tsx <<'EOF'
          import React,{useEffect,useMemo,useState} from 'react';
          import {Download,Share,X} from 'lucide-react';
          type DIP=Event&{prompt:()=>Promise<void>;userChoice:Promise<{outcome:'accepted'|'dismissed';platform:string}>};
          type D='ios'|'android'|'windows'|'mac'|'linux'|'other'; type B='edge'|'chrome'|'safari'|'firefox'|'other';
          const KEY='profea_install_promo_v3_dismissed_at',TTL=7*24*60*60*1000;
          const standalone=()=>typeof window!=='undefined'&&(matchMedia('(display-mode: standalone)').matches||(navigator as any).standalone===true);
          const env=()=>{const u=navigator.userAgent.toLowerCase(),p=String((navigator as any).userAgentData?.platform||navigator.platform||'').toLowerCase();let d:D='other';if(/iphone|ipad|ipod/.test(u)||(p.includes('mac')&&navigator.maxTouchPoints>1))d='ios';else if(u.includes('android'))d='android';else if(u.includes('windows')||p.includes('win'))d='windows';else if(u.includes('mac'))d='mac';else if(u.includes('linux'))d='linux';let b:B='other';if(u.includes('edg/'))b='edge';else if(u.includes('firefox'))b='firefox';else if(u.includes('chrome')||u.includes('crios'))b='chrome';else if(u.includes('safari'))b='safari';return{d,b}};
          export function AppInstallPromo(){const[prompt,setPrompt]=useState<DIP|null>(null),[visible,setVisible]=useState(false),[help,setHelp]=useState(false),e=useMemo(env,[]);useEffect(()=>{if(standalone())return;const t=Number(localStorage.getItem(KEY)||0),auto=!t||Date.now()-t>=TTL;const bi=(ev:Event)=>{ev.preventDefault();setPrompt(ev as DIP);if(auto)setTimeout(()=>setVisible(true),300)};const ai=()=>{setPrompt(null);setVisible(false);localStorage.removeItem(KEY)};const open=()=>{if(!standalone()){setVisible(true);setHelp(false)}};addEventListener('beforeinstallprompt',bi);addEventListener('appinstalled',ai);addEventListener('profea:open-install',open);const timer=auto?setTimeout(()=>setVisible(true),1400):0;return()=>{removeEventListener('beforeinstallprompt',bi);removeEventListener('appinstalled',ai);removeEventListener('profea:open-install',open);if(timer)clearTimeout(timer)}},[]);const install=async()=>{if(!prompt){setHelp(true);return}try{await prompt.prompt();const c=await prompt.userChoice;if(c.outcome==='accepted')setVisible(false);setPrompt(null)}catch{setHelp(true)}};if(!visible||standalone())return null;const msg:Record<D,string>={ios:'En iPhone/iPad: abre PROFEA en Safari, pulsa Compartir → Añadir a pantalla de inicio → Añadir.',android:'En Android: usa Chrome/Edge y pulsa ⋮ → Instalar aplicación o Añadir a pantalla de inicio.',windows:'En Windows: usa Edge o Chrome y pulsa Instalar en la barra de direcciones; también puedes usar ⋮ → Aplicaciones → Instalar PROFEA.',mac:e.b==='safari'?'En Safari: Archivo → Añadir al Dock. En Chrome/Edge usa Instalar en la barra de direcciones.':'En Mac: usa Instalar en Chrome/Edge. En Safari compatible: Archivo → Añadir al Dock.',linux:'En Chrome/Edge/Chromium usa Instalar desde la barra de direcciones o el menú.',other:'Usa Instalar aplicación o Añadir a pantalla de inicio desde el menú del navegador.'};const lab:Record<D,string>={ios:'iPhone/iPad',android:'Android',windows:'Windows',mac:'Mac',linux:'Linux',other:'este dispositivo'};return <aside className="profea-install-promo no-print" aria-label="Instalar PROFEA"><div className="profea-install-promo__icon"><img src="/icons/icon-192.png" alt=""/></div><div className="profea-install-promo__copy"><span className="profea-install-promo__title">Instala PROFEA</span><span className="profea-install-promo__text">{help?msg[e.d]:`Dispositivo detectado: ${lab[e.d]}. Instala PROFEA con el icono oficial de Diputación de Cádiz.`}</span></div><div className="profea-install-promo__actions"><button type="button" className="profea-install-promo__button" onClick={install}>{e.d==='ios'&&!prompt?<Share size={14} className="inline mr-1"/>:<Download size={14} className="inline mr-1"/>}{prompt?'Instalar PROFEA':'Cómo instalar'}</button><button type="button" className="profea-install-promo__dismiss" onClick={()=>{localStorage.setItem(KEY,String(Date.now()));setVisible(false)}} aria-label="Ahora no"><X size={16}/></button></div></aside>}
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('components/Configuracion.tsx'); s=p.read_text()
          if 'Instalación de PROFEA' not in s:
              marker='''                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 font-medium">\n                  Respalde toda la base de datos local de trabajadores activos,'''
              card='''                <div className="mt-5 rounded-xl border border-sky-200 dark:border-sky-800 bg-sky-50/70 dark:bg-sky-950/30 p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">\n                  <div><p className="text-sm font-bold text-slate-800 dark:text-slate-100">Instalación de PROFEA</p><p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Instala PROFEA como aplicación o acceso directo con el icono oficial de Diputación de Cádiz. El sistema detectará tu dispositivo y navegador.</p></div>\n                  <button type="button" onClick={() => window.dispatchEvent(new CustomEvent('profea:open-install'))} className="inline-flex items-center justify-center gap-2 rounded-xl border border-sky-200 dark:border-sky-800 bg-white dark:bg-slate-900 px-4 py-2.5 text-sm font-bold text-sky-700 dark:text-sky-300 shadow-sm hover:bg-sky-50 dark:hover:bg-sky-900/30 transition-colors"><Download className="w-4 h-4"/>Instalar PROFEA</button>\n                </div>\n'''
              if marker not in s: raise SystemExit('Configuracion marker missing')
              s=s.replace(marker,card+marker,1);p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('public/manifest.webmanifest').read_text()); assert m['name']==m['short_name']=='PROFEA'
          for i in m['icons']: assert Path('public'+i['src']).exists(),i
          PY
          npm ci
          npm run lint
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/icons public/favicon.ico public/manifest.webmanifest public/service-worker.js index.html components/AppInstallPromo.tsx components/Configuracion.tsx
          git commit -m 'feat: make PROFEA installable across devices'
          git push
