name: One-off sidebar refactor

on:
  push:
    branches: [refactor-ui-foundation]
    paths:
      - '.github/workflows/oneoff-sidebar-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refactor-ui-foundation
      - run: python scripts/refactor_sidebar_groups.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: git rm -f .github/workflows/oneoff-sidebar-refactor.yml scripts/refactor_sidebar_groups.py
      - run: |
          git config user.name "davidhinojogarcia-commits"
          git config user.email "davidhinojogarcia@gmail.com"
          git add components/Sidebar.tsx
          git commit -m "refactor: group sidebar navigation and adopt UI system"
          git push origin refactor-ui-foundation
