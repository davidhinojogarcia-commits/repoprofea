name: Patch scanner worker target

on:
  push:
    paths:
      - '.github/workflows/patch-scanner-worker-target.yml'

permissions:
  contents: write

jobs:
  patch-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require manual worker target for scanner extraction
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('components/CameraScannerModal.tsx')
          s = p.read_text()

          old = """interface CameraScannerModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  onToast: (msg: string, type: 'success' | 'error') => void;\n  onAddWorkers?: (workers: any[]) => void;\n}\n\nexport const CameraScannerModal: React.FC<CameraScannerModalProps> = ({ isOpen, onClose, onToast, onAddWorkers }) => {\n  const [pages, setPages] = useState<CapturedPage[]>([]);"""
          new = """interface ScannerWorkerTarget {\n  id: number;\n  apellidosNombre: string;\n  dni: string;\n  obra: string;\n}\n\ninterface AdministrativeDataPayload {\n  dni?: string;\n  birthDate?: string;\n  nuss?: string;\n  iban?: string;\n  documentText?: string;\n}\n\ninterface CameraScannerModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  onToast: (msg: string, type: 'success' | 'error') => void;\n  onAddWorkers?: (workers: any[]) => void;\n  workers: ScannerWorkerTarget[];\n  onApplyAdministrativeData: (workerId: number, data: AdministrativeDataPayload) => Promise<void>;\n}\n\nexport const CameraScannerModal: React.FC<CameraScannerModalProps> = ({ isOpen, onClose, onToast, onAddWorkers, workers, onApplyAdministrativeData }) => {\n  const [pages, setPages] = useState<CapturedPage[]>([]);\n  const [selectedWorkerId, setSelectedWorkerId] = useState<string>('');"""
          if old not in s:
              raise SystemExit('Camera props anchor not found')
          s = s.replace(old, new, 1)

          old = """  const handleRecognizeAdministrativeData = async () => {\n    if (!pages.length) {\n      onToast('Captura primero el documento que contiene DNI/NIE, fecha de nacimiento, Seguridad Social o IBAN.', 'error');\n      return;\n    }\n    setIsRecognizingAdministrative(true);"""
          new = """  const handleRecognizeAdministrativeData = async () => {\n    if (!selectedWorkerId) {\n      onToast('Selecciona manualmente el trabajador al que quieres asignar los datos.', 'error');\n      return;\n    }\n    if (!pages.length) {\n      onToast('Captura primero el documento que contiene DNI/NIE, fecha de nacimiento, Seguridad Social o IBAN.', 'error');\n      return;\n    }\n    setIsRecognizingAdministrative(true);"""
          if old not in s:
              raise SystemExit('Recognition guard anchor not found')
          s = s.replace(old, new, 1)

          old = """      window.dispatchEvent(new CustomEvent('profea:administrative-data-recognized', {\n        detail: accepted,\n      }));\n\n      // Una vez entregados los datos al formulario, liberamos el escáner para la siguiente persona.\n      setPages([]);\n      setPreviewImage(null);\n      if (fileInputRef.current) fileInputRef.current.value = '';\n      if (galleryInputRef.current) galleryInputRef.current.value = '';\n\n      const detectedLabels = ["""
          new = """      const workerId = Number(selectedWorkerId);\n      const targetWorker = workers.find(worker => worker.id === workerId);\n      if (!targetWorker) {\n        throw new Error('El trabajador seleccionado ya no está disponible.');\n      }\n\n      // Guardar primero en la ficha elegida; solo después se elimina la captura temporal.\n      await onApplyAdministrativeData(workerId, accepted);\n\n      setPages([]);\n      setPreviewImage(null);\n      setSelectedWorkerId('');\n      if (fileInputRef.current) fileInputRef.current.value = '';\n      if (galleryInputRef.current) galleryInputRef.current.value = '';\n\n      const detectedLabels = ["""
          if old not in s:
              raise SystemExit('Dispatch anchor not found')
          s = s.replace(old, new, 1)

          old = """      onToast(`Datos incorporados: ${detectedLabels}. Escáner listo para la siguiente captura.`, 'success');"""
          new = """      onToast(`Datos incorporados a ${targetWorker.apellidosNombre}: ${detectedLabels}. Escáner limpio y listo para otra captura.`, 'success');"""
          if old not in s:
              raise SystemExit('Success toast anchor not found')
          s = s.replace(old, new, 1)

          old = """              <RemoteScannerPairing onCapture={handleRemoteCapture} onToast={onToast} />\n\n              {/* Continuous Capture Mode Switch Card */}"""
          new = """              <RemoteScannerPairing onCapture={handleRemoteCapture} onToast={onToast} />\n\n              {/* Manual destination worker: never infer who receives the scanned data */}\n              <div className=\"p-4 bg-amber-50/70 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-900/50 rounded-2xl\">\n                <label className=\"block text-xs font-extrabold text-amber-900 dark:text-amber-200 uppercase tracking-wider mb-2\">\n                  Trabajador destino\n                </label>\n                <select\n                  value={selectedWorkerId}\n                  onChange={(e) => setSelectedWorkerId(e.target.value)}\n                  className=\"w-full px-3 py-3 bg-white dark:bg-slate-900 border border-amber-300 dark:border-amber-800 rounded-xl text-sm font-semibold text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-400\"\n                >\n                  <option value=\"\">Selecciona manualmente un trabajador...</option>\n                  {[...workers]\n                    .sort((a, b) => a.apellidosNombre.localeCompare(b.apellidosNombre, 'es'))\n                    .map(worker => (\n                      <option key={worker.id} value={worker.id}>\n                        {worker.apellidosNombre}{worker.dni ? ` · ${worker.dni}` : ''}{worker.obra ? ` · ${worker.obra}` : ''}\n                      </option>\n                    ))}\n                </select>\n                {selectedWorkerId ? (() => {\n                  const worker = workers.find(item => item.id === Number(selectedWorkerId));\n                  if (!worker) return null;\n                  return (\n                    <div className=\"mt-2 text-xs text-amber-900 dark:text-amber-200\">\n                      <span className=\"font-bold\">Destino:</span> {worker.apellidosNombre}\n                      {worker.dni ? ` · DNI ${worker.dni}` : ''}\n                      {worker.obra ? ` · ${worker.obra}` : ''}\n                    </div>\n                  );\n                })() : (\n                  <p className=\"mt-2 text-xs text-amber-800 dark:text-amber-300\">El botón Extraer datos permanecerá bloqueado hasta elegir un trabajador.</p>\n                )}\n              </div>\n\n              {/* Continuous Capture Mode Switch Card */}"""
          if old not in s:
              raise SystemExit('Manual target UI anchor not found')
          s = s.replace(old, new, 1)

          old = """                    disabled={isRecognizingAdministrative || isRecognizing}\n                    className=\"px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all shadow-md disabled:opacity-50\""""
          new = """                    disabled={!selectedWorkerId || isRecognizingAdministrative || isRecognizing}\n                    className=\"px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all shadow-md disabled:opacity-40 disabled:cursor-not-allowed\""""
          if old not in s:
              raise SystemExit('Extract button anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

          p = Path('App.tsx')
          s = p.read_text()
          old = """          <CameraScannerModal\n            isOpen={isScannerOpen}\n            onClose={() => setIsScannerOpen(false)}\n            onToast={(msg, type) => setToast({ message: msg, type })}\n            onAddWorkers={handleAddMultipleWorkers}\n          />"""
          new = """          <CameraScannerModal\n            isOpen={isScannerOpen}\n            onClose={() => setIsScannerOpen(false)}\n            onToast={(msg, type) => setToast({ message: msg, type })}\n            onAddWorkers={handleAddMultipleWorkers}\n            workers={people.map(person => ({\n              id: person.id,\n              apellidosNombre: person.apellidosNombre,\n              dni: person.dni,\n              obra: person.obra,\n            }))}\n            onApplyAdministrativeData={async (workerId, data) => {\n              const target = peopleRef.current.find(person => person.id === workerId);\n              if (!target) throw new Error('No se ha encontrado el trabajador seleccionado.');\n\n              const updated: Person = {\n                ...target,\n                ...(data.dni ? { dni: data.dni } : {}),\n                ...(data.birthDate ? { fechaNacimiento: data.birthDate } : {}),\n                ...(data.nuss ? { numeroSeguridadSocial: data.nuss } : {}),\n                ...(data.iban ? { iban: data.iban } : {}),\n                sincronizadoEnNube: true,\n              };\n\n              await updateDocument('trabajadores', updated.id, updated as any);\n              updateAutocompleteLists(updated);\n              setPeople(current => current.map(person => person.id === updated.id ? updated : person));\n            }}\n          />"""
          if old not in s:
              raise SystemExit('App scanner anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Verify scanner target behavior
        run: |
          grep -q "Trabajador destino" components/CameraScannerModal.tsx
          grep -q "disabled={!selectedWorkerId" components/CameraScannerModal.tsx
          grep -q "await onApplyAdministrativeData(workerId, accepted)" components/CameraScannerModal.tsx
          grep -q "workers={people.map" App.tsx
          grep -q "numeroSeguridadSocial: data.nuss" App.tsx
          ! grep -q "profea:administrative-data-recognized" components/CameraScannerModal.tsx

      - name: Validate TypeScript
        run: |
          npm install --no-audit --no-fund
          npm run lint

      - name: Commit worker target scanner flow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/CameraScannerModal.tsx App.tsx
          git commit -m "Require manual worker target for scanner data" || exit 0
          git push
